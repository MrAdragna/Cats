<script>
(function(){
  try{
    var pref = localStorage.getItem('themePref') || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --paper:#eef1ee;
    --ink:#1e2624;
    --ink-soft:#5b655f;
    --line:#d3d9d2;
    --card:#ffffff;
    --strain:#a8472a;
    --strain-soft:rgba(168,71,42,0.22);
    --pee:#2c6e6b;
    --accent:#3a6b63;
    --error:#a8412a;
    --band-a:#e6e9e3;
    --band-b:#eef1ee;
    --week-band-a:#d9ded3;
    --week-band-b:#f4f6f1;
    --on-ink:#ffffff;
    --poop:#6b4a2f; --poop-edge:#3a2a1c;
    --stress:#7a3b8c;
    --sunk:#e3e8e3;
    color-scheme:light;
  }
  /* Dark mode: near-black base (not pure black, so elevated surfaces can read
     lighter), desaturated accents, off-white text, borders instead of shadows. */
  :root[data-theme="dark"]{
    --paper:#0d1110;
    --ink:#e8edea;
    --ink-soft:#9ba7a1;
    --line:#29302d;
    --card:#161b19;
    --strain:#e27d5d;
    --strain-soft:rgba(226,125,93,0.26);
    --pee:#4db6ae;
    --accent:#3f8a80;
    --error:#e8785d;
    --band-a:#27302d;
    --band-b:#171c1a;
    --week-band-a:#27302d;
    --week-band-b:#171c1a;
    --on-ink:#0d1110;
    --poop:#c08f62; --poop-edge:#e0b88f;
    --stress:#c88ad8;
    --sunk:#0a0d0c;
    color-scheme:dark;
  }
  html{background:var(--paper);}
  :root[data-theme="dark"] .chart-card,:root[data-theme="dark"] .stat{box-shadow:none;}
  :root[data-theme="dark"] .fab-add{box-shadow:0 6px 18px rgba(0,0,0,0.6);}
  :root[data-theme="dark"] .cat-btn img{filter:brightness(0.92);}
  :root[data-theme="dark"] .tooltip{background:#2a322f;color:#e8edea;border:1px solid #3a4440;}
  *{box-sizing:border-box;}
  html{font-size:115%;}
  html,body{height:100%;}
  body{
    margin:0;
    background:transparent;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.45;
  }

  /* device preview toggle (testing only) */
  .device-toggle{
    position:sticky; top:0; z-index:40;
    display:flex; justify-content:center; gap:6px;
    padding:10px; background:#c9c4b5; border-bottom:1px solid #b7b2a1;
  }
  .device-toggle button{
    padding:6px 14px; border-radius:999px; border:1px solid #a39d89;
    background:#efece3; color:#1e2624; font-size:0.8rem; cursor:pointer;
  }
  .device-toggle button.active{background:var(--ink); color:var(--on-ink); border-color:var(--ink);}

  .stage{display:flex; justify-content:center; align-items:flex-start; padding:24px 12px 60px; min-height:calc(100vh - 46px);}
  .stage.native-stage{padding:0; min-height:100vh; display:block;}
  .device-frame{background:transparent; transition:all .15s ease;}
  .device-frame.desktop{
    width:100%; max-width:980px; border-radius:4px;
    height:auto; aspect-ratio:auto; overflow:visible;
  }
  .device-frame.mobile{
    aspect-ratio:9/19.5;
    height:min(844px, 82vh);
    width:auto;
    max-width:92vw;
    border-radius:36px;
    box-shadow:0 0 0 10px #1c1b19, 0 0 0 12px #3a3835;
    overflow-y:auto;
    overflow-x:hidden;
  }
  /* Real phone / installed web app: no fake bezel, fills the actual screen.
     Safe-area padding keeps content clear of notches/home indicators. */
  .device-frame.native{
    width:100%; max-width:100%; height:auto; aspect-ratio:auto;
    border-radius:0; box-shadow:none; overflow:visible;
  }
  .device-frame.native .wrap{
    padding-bottom:max(50px, env(safe-area-inset-bottom));
    padding-left:max(18px, env(safe-area-inset-left));
    padding-right:max(18px, env(safe-area-inset-right));
  }
  .device-frame.native .sticky-top{
    padding-top:max(22px, env(safe-area-inset-top));
  }

  .wrap{padding:0 18px 50px;}
  /* Sticky nav/header bar: pinned at the top of the scrolling area at all
     times (navigation, day/period picker, add-event button) — and since it
     carries its own top padding (including the safe-area inset), the notch
     stays covered by a solid background no matter how far you've scrolled. */
  .sticky-top{
    position:sticky; top:0; z-index:30;
    background:var(--paper);
    padding-top:22px; padding-bottom:2px;
  }
  header{position:relative;margin-bottom:14px;padding-bottom:2px;}
  header h1{text-align:center;font-size:clamp(1.3rem,7.4vw,1.75rem);line-height:1.12;margin:12px 0 0;font-weight:700;letter-spacing:-0.015em;text-wrap:balance;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--title-font, inherit);}
  header .sub{color:var(--ink-soft);font-size:0.85rem;}

  /* Period-change animation */
  @keyframes slideInFromRight{
    from{opacity:0; transform:translateX(55px);}
    to{opacity:1; transform:translateX(0);}
  }
  @keyframes slideInFromLeft{
    from{opacity:0; transform:translateX(-55px);}
    to{opacity:1; transform:translateX(0);}
  }
  #periodContent.slide-fwd{animation:slideInFromRight .48s cubic-bezier(0.22,0.61,0.36,1);}
  #periodContent.slide-back{animation:slideInFromLeft .48s cubic-bezier(0.22,0.61,0.36,1);}

  .state-msg{padding:60px 16px;text-align:center;color:var(--ink-soft);font-size:0.95rem;}
  .state-msg.error{color:var(--error);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cat-tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 10px;}
  .cat-cell{position:relative;height:84px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .cat-btn{width:100%;height:100%;border-radius:50%;border:2px solid var(--line);padding:0;background:var(--card);overflow:hidden;pointer-events:none;
    color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;
    }
  .cat-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .cat-ring{position:absolute;top:6px;left:0;width:72px;height:72px;border-radius:36px;border:3px solid var(--accent);pointer-events:none;will-change:left,width,transform;}
  .cat-cell.active::after{z-index:3;content:var(--badge, '');position:absolute;top:2px;left:calc(50% + 12px);font-size:22px;line-height:1;animation:badgePop .5s cubic-bezier(.3,1.5,.5,1);}
  @keyframes badgePop{from{transform:scale(0) rotate(-30deg);}to{transform:scale(1) rotate(0);}}
  .cat-face{position:relative;width:64px;height:64px;opacity:.6;transform:scale(.86);transition:transform .38s cubic-bezier(.3,1.3,.5,1),opacity .25s ease;pointer-events:none;}
  .cat-cell.active .cat-face{opacity:1;transform:scale(1);}
  .cat-cell:active .cat-face{transform:scale(.92);}
  .cat-sticker{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;}
  .cat-sticker svg{width:100%;height:100%;display:block;}
  .holiday-tip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:8px 8px 8px 14px;margin:0 0 12px;font-size:0.88rem;}
  .holiday-tip span{flex:1;min-width:0;}
  .holiday-tip button{border:none;border-radius:999px;padding:8px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;}
  .holiday-tip button.x{background:transparent;color:var(--ink-soft);padding:8px 10px;}
  .ed-row{display:flex;gap:6px;align-items:center;}
  .ed-title{font-weight:700;text-align:center;margin-bottom:10px;}
  .ed-input{width:100%;font-size:16px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  .ed-btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--ink);cursor:pointer;}
  .ed-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .ed-status{min-height:1.2em;font-size:0.8rem;color:var(--ink-soft);text-align:center;margin-top:8px;}
  .stk-prev{position:relative;width:180px;height:180px;margin:52px auto 12px;touch-action:none;cursor:grab;}
  .stk-face{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;}
  .stk-face img{width:100%;height:100%;object-fit:cover;}
  input[type=range]{accent-color:var(--accent);}
  .stk-pal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
  .stk-pal button{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;padding:4px;color:var(--ink);}
  .stk-pal button.active{border-color:var(--accent);background:var(--sunk);}
  .stk-pal button svg{width:100%;height:100%;}
  .stk-cats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .stk-cats button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:0.85rem;cursor:pointer;}
  .stk-cats button.active{background:var(--ink);color:var(--on-ink);}
  @keyframes catSwap{from{opacity:0;transform:translateY(8px) scale(.985);}to{opacity:1;transform:none;}}
  #periodContent.cat-swap{animation:catSwap .38s cubic-bezier(0.22,0.61,0.36,1);}
  .view-switch{position:relative;display:flex;margin:0 auto 12px;max-width:260px;background:var(--line);border-radius:999px;padding:3px;}
  .view-switch .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--ink);border-radius:999px;transition:transform .22s cubic-bezier(0.22,0.61,0.36,1);}
  .view-switch[data-view="day"] .pill{transform:translateX(100%);}
  .view-switch button{position:relative;flex:1;padding:8px 0;border:none;background:transparent;color:var(--ink-soft);font-size:0.85rem;font-weight:700;cursor:pointer;border-radius:999px;transition:color .2s;}
  .view-switch button.active{color:var(--on-ink);}
  .view-tabs{display:none;}
  :root[data-theme="dark"] .list-day-header td{background:#2f423c;color:#f1f6f3;box-shadow:inset 4px 0 0 var(--accent);}
  .list-table td,.list-table th{padding-left:6px;padding-right:6px;}
  .list-table td:last-child{word-break:break-word;}
  .last-seen{container-type:inline-size;display:flex;flex-wrap:nowrap;gap:6px;margin:0 0 12px;}
  .last-seen span{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 4px;font-size:clamp(0.56rem,3.2cqw,0.76rem);color:var(--ink-soft);}
  .last-seen b{color:var(--ink);font-weight:700;}
  .fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1;}
  .fx span{position:absolute;top:-30px;opacity:0.3;animation:fxFall linear infinite;will-change:transform;}
  @keyframes fxFall{0%{transform:translate3d(0,-30px,0) rotate(0);}100%{transform:translate3d(var(--dx,20px),calc(100vh + 40px),0) rotate(var(--rot,360deg));}}
  .toast{position:fixed;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom) + 90px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:0.88rem;font-weight:600;z-index:95;transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .day-nav button:active,.entry-type-btn:active,.size-row button:active,.quick-row button:active,.today-btn:active,.list-sort-toggle:active,.view-switch button:active{transform:scale(.95);}
  .list-table,.stat,.last-seen{font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
  .about-card{background:var(--card);border-radius:16px;padding:20px 22px;max-width:340px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
  .about-line{color:var(--ink-soft);font-size:0.9rem;text-align:center;margin-bottom:3px;}
  .about-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:12px 0 5px;}
  .about-select{width:100%;font-size:16px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  .theme-seg{display:flex;background:var(--line);border-radius:999px;padding:3px;margin-bottom:14px;}
  .theme-seg button{flex:1;border:none;background:transparent;color:var(--ink-soft);padding:7px 0;border-radius:999px;font-size:0.82rem;font-weight:600;cursor:pointer;}
  .theme-seg button.active{background:var(--ink);color:var(--on-ink);}
  .view-tabs button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:0.72rem;font-weight:600;cursor:pointer;}
  .view-tabs button.active{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}

  .day-nav{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .day-nav button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem;color:var(--ink);flex-shrink:0;}
  .day-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .day-nav select, .day-nav .period-label{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:0.85rem;color:var(--ink);}
  .day-nav select{flex:1; min-width:0;}
  .period-label{flex:1;text-align:center;font-weight:600;}
  .today-btn{width:auto !important;padding:0 12px;margin-left:auto;font-size:0.78rem;background:var(--card);color:var(--accent);border:1px solid var(--accent) !important;font-weight:600;}
  .today-btn.current{background:var(--accent);color:#fff;}
  .entry-type-btn{padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:0.82rem;font-weight:600;cursor:pointer;}
  .entry-type-btn.active{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}

  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px;flex:1;}
  .bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;border-radius:4px;transition:width .3s ease;}
  .stat .num{font-size:1.25rem;font-weight:700;}
  .stat .lbl{font-size:0.72rem;color:var(--ink-soft);}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px;margin-bottom:12px;}
  .chart-card h3{margin:0 0 8px;font-size:1rem;color:var(--ink);font-weight:800;text-align:center;letter-spacing:-0.01em;}
  .overlay-menu-btn{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:0.76rem;font-weight:600;cursor:pointer;}
  .overlay-menu{position:absolute;right:0;top:32px;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,0.2);z-index:20;overflow:hidden;min-width:150px;}
  .overlay-menu button{display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:none;font-size:0.82rem;color:var(--ink);cursor:pointer;}
  .overlay-menu button.active{background:var(--accent);color:#fff;font-weight:600;}
  .overlay-menu button:hover:not(.active){background:var(--paper);}
  .chart-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:8px;}
  .chart-viewport{position:relative;}
  .day-marker-line{
    position:absolute; left:50%; top:0; bottom:0; width:2px;
    background:var(--ink); opacity:0.55; pointer-events:none; z-index:5;
    transform:translateX(-50%);
  }
  .day-marker-info{
    min-height:1.6em; padding:9px 11px; background:var(--paper);
    border-radius:8px; font-size:0.82rem; margin-top:8px; line-height:1.5;
  }
  .day-marker-info .marker-time{font-weight:700;}
  .list-table{width:100%;border-collapse:collapse;font-size:0.82rem;}
  .list-table th{text-align:left;padding:6px 8px;color:var(--ink-soft);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;border-bottom:2px solid var(--ink);}
  .list-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .list-table tr:nth-child(even){background:var(--band-a);}
  .list-controls{display:flex;gap:8px;align-items:center;margin:-14px -10px 0;padding:12px 10px 8px;
    position:sticky;top:var(--stickyH, 120px);z-index:6;background:var(--card);border-radius:10px 10px 0 0;border-bottom:1px solid var(--line);}
  .list-range{flex:1;min-width:0;font-size:16px;font-weight:700;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  .list-custom{display:flex;gap:6px;align-items:center;padding:10px 0 4px;font-size:0.8rem;color:var(--ink-soft);}
  .list-custom input{flex:1;min-width:0;font-size:16px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  .list-table{table-layout:auto;}
  .list-table th,.list-table td{text-align:center;}
  .list-table th:last-child,.list-table td:last-child{text-align:left;}
  .list-table th,.list-table td{border-left:none;border-right:none;}
  .list-table th:nth-child(1),.list-table td:nth-child(1),.list-table th:nth-child(2),.list-table td:nth-child(2){white-space:nowrap;}
  .list-table th:nth-child(2),.list-table td:nth-child(2){text-align:left;}
  .list-table th:nth-child(3),.list-table td:nth-child(3){white-space:nowrap;}
  .list-card .list-table{font-size:0.78rem;}
  .list-card .list-table thead th{position:sticky;top:calc(var(--stickyH, 120px) + var(--ctlH, 52px));z-index:5;background:var(--card);box-shadow:0 2px 0 var(--ink);border-bottom:none;}
  .list-card .list-day-header td{position:sticky;top:calc(var(--stickyH, 120px) + var(--ctlH, 52px) + var(--theadH, 30px));z-index:4;}
  .list-controls-old{display:flex;gap:6px;align-items:center;margin:-14px -10px 8px;padding:12px 10px 8px;
    position:sticky;top:var(--stickyH, 120px);z-index:6;background:var(--card);border-radius:10px 10px 0 0;border-bottom:1px solid var(--line);}
  .list-controls .sel-unused{flex:1;min-width:100px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:0.78rem;color:var(--ink);}

  .list-day-header td{background:var(--ink);color:var(--on-ink);font-weight:700;font-size:0.78rem;padding:8px;border-bottom:none;}

<script>
// Replace with your deployed Apps Script Web App URL.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyP6WvRGtwzsS5zjR2BiWMcwXbQZPFK90GQTD_7wuwbEdR56Vvjq3tEAkxKr7lS6uoR/exec';

// Approximate coordinates for weather + sunrise/sunset lookups: Howard Miller
// Public Library, Zeeland, MI — update if your location differs.
const WEATHER_LAT = 42.8081;
const WEATHER_LON = -86.0164;

// Recurring daily feeding schedule (not from the sheet — fixed reference times).
const FEEDING_TIMES = [
  {hour:0,  minute:0,  label:'Midnight snack'},
  {hour:6,  minute:0,  label:'Breakfast'},
  {hour:12, minute:0,  label:'Lunch'},
  {hour:18, minute:0,  label:'Dinner'},
  {hour:20, minute:0,  label:'Treat/med'}
];

// Adjustable heuristics for color-coding the stats — not medical guidance,
// just rough personal-tracking thresholds you can tune to whatever your vet
// suggests or whatever feels normal for your own cat.
const PEE_COUNT_LOW = 2;         // fewer pees/day than this gets flagged
const PEE_COUNT_HIGH = 6;        // more pees/day than this gets flagged
const MAX_PEE_GAP_HOURS = 8;      // longest gap between pees before flagging
const MAX_STRAINING_MIN = 10;     // straining episode length before flagging

let straining = [];
let pee = [];
let poop = [];
let stressEvents = [];
let allStraining = [], allPee = [], allPoop = [], allStressEvents = [];

// Two cats get fully separate views of the data, like switching tabs for
// different sections of an app — rename these to your actual cats' names.
// Entries with no Cat value (written before this feature existed) count as
// belonging to the first cat, for backward compatibility.
// Stamped each time the file is regenerated, so the popup tells you which
// version your device is actually running.
const BUILD_STAMP = '2026-11-01T18:22:45-05:00';
// ===== Holidays =====
const HOLIDAY_ORDER = ['newyear','christmas','valentine','stpatrick','easter','july4','halloween','thanksgiving'];
const HOLIDAY_BASE = {
  newyear:     {name:"New Year's",      badge:'🎉', fx:['🎊','✨','🎉'], light:'#a8841f', dark:'#b8952b', start:'12-27', end:'01-02'},
  christmas:   {name:'Christmas',       badge:'🎅', fx:['❄️','❄️','✨'], light:'#b3342d', dark:'#b3342d', start:'12-01', end:'12-26'},
  valentine:   {name:"Valentine's Day", badge:'💝', fx:['💗','💕','❤️'], light:'#c2345f', dark:'#c2345f', start:'02-07', end:'02-14'},
  stpatrick:   {name:"St. Patrick's Day",badge:'🍀', fx:['☘️','🍀'],       light:'#2f8f4e', dark:'#2f8f4e', start:'03-10', end:'03-17'},
  easter:      {name:'Easter',          badge:'🐣', fx:['🌷','🥚','🐣'], light:'#7f5bc0', dark:'#7f5bc0', start:'easter-6', end:'easter+0'},
  july4:       {name:'Fourth of July',  badge:'🎆', fx:['✨','🎆','⭐'], light:'#2b5fb5', dark:'#3a6fc4', start:'06-29', end:'07-05'},
  halloween:   {name:'Halloween',       badge:'🎃', fx:['🦇','🎃','👻'], light:'#c8651b', dark:'#c8651b', start:'10-15', end:'11-01'},
  thanksgiving:{name:'Thanksgiving',    badge:'🦃', fx:['🍂','🍁','🍂'], light:'#a8602a', dark:'#b46c33', start:'thanksgiving-7', end:'thanksgiving+0'}
};
let holidayOverrides = {};   // key -> {name,start,end,font,color,accent,stickers} from the sheet's Holidays tab
let holidayIcons = {};       // key -> data URI
function setHolidayConfig(list){
  const o = {};
  (list || []).forEach(r => {
    if(!r || !r.key) return;
    let st = {}; try{ st = r.stickers ? JSON.parse(r.stickers) : {}; }catch(e){}
    o[r.key] = {name:r.name, start:r.start, end:r.end, font:r.font, color:r.color, accent:r.accent, stickers:st};
  });
  holidayOverrides = o;
}
function hol(key){
  const b = HOLIDAY_BASE[key] || {name:key, badge:'✨', fx:['✨'], light:'#3a6b63', dark:'#3a6b63', start:'', end:''};
  const o = holidayOverrides[key] || {};
  return {key, name:o.name || b.name, badge:b.badge, fx:b.fx, light:b.light, dark:b.dark,
          start:o.start || b.start, end:o.end || b.end, font:o.font || '', color:o.color || '', accent:o.accent || '',
          stickers:o.stickers || {}};
}
function allHolidayKeys(){
  return HOLIDAY_ORDER.concat(Object.keys(holidayOverrides).filter(k => HOLIDAY_ORDER.indexOf(k) === -1));
}
function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y, mo-1, da);
}
function thanksgivingDate(y){
  const nov1 = new Date(y, 10, 1);
  return new Date(y, 10, 1 + ((4 - nov1.getDay() + 7) % 7) + 21);
}
// Spec: "MM-DD" | "easter[+-N]" | "thanksgiving[+-N]"
function resolveSpec(spec, y){
  spec = String(spec || '').trim().toLowerCase();
  let m = spec.match(/^(\d{1,2})[-\/](\d{1,2})$/);
  if(m) return new Date(y, Number(m[1]) - 1, Number(m[2]));
  m = spec.match(/^(easter|thanksgiving)\s*([+-]\s*\d+)?$/);
  if(m){
    const d = m[1] === 'easter' ? easterDate(y) : thanksgivingDate(y);
    d.setDate(d.getDate() + (parseInt((m[2] || '0').replace(/\s/g,''), 10) || 0));
    return d;
  }
  return null;
}
function holidayActive(h, now){
  const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for(const y of [day0.getFullYear() - 1, day0.getFullYear()]){
    const st = resolveSpec(h.start, y); let en = resolveSpec(h.end, y);
    if(!st || !en) continue;
    if(en < st) en = resolveSpec(h.end, y + 1);
    if(day0 >= st && day0 <= en) return true;
  }
  return false;
}
function currentHoliday(now){
  now = now || new Date();
  return allHolidayKeys().find(k => holidayActive(hol(k), now)) || null;
}

// --- per-device preferences ---
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
let holidayPref = lsGet('holidayPref', 'follow');          // 'follow' | 'off' | <holiday key> (pinned on this device)
if(holidayPref === 'auto') holidayPref = 'follow';
let holidayChange = lsGet('holidayChange', 'ask');         // 'ask' (stay put + show a tip) | 'auto'
let activeHolidayKey = null;

function setHolidayPref(v){ holidayPref = v; lsSet('holidayPref', v); applyHoliday(); }
function setHolidayChange(v){ holidayChange = v; lsSet('holidayChange', v); applyHoliday(); syncSettingsUI(); }
function effectiveHoliday(){
  if(holidayPref === 'off') return null;
  if(holidayPref !== 'follow') return holidayPref;
  const sched = currentHoliday() || '';
  let shown = lsGet('holidayShown', null);
  if(shown === null || holidayChange === 'auto'){ shown = sched; lsSet('holidayShown', shown); }
  return shown || null;
}
function updateHolidayTip(){
  const el = document.getElementById('holidayTip');
  if(!el) return;
  const sched = currentHoliday() || '';
  const shown = lsGet('holidayShown', '') || '';
  const show = holidayPref === 'follow' && holidayChange === 'ask' && sched !== shown && lsGet('holidayTipDismissed', '') !== (sched || 'none');
  if(!show){ el.style.display = 'none'; return; }
  const label = sched ? hol(sched).badge + ' Switch to <b>' + escapeHtml(hol(sched).name) + '</b>' : 'Switch to <b>standard theme</b>';
  el.innerHTML = '<span>' + label + '</span><button onclick="acceptHolidaySwitch()">Switch</button><button class="x" onclick="dismissHolidayTip()" aria-label="Dismiss">✕</button>';
  el.style.display = 'flex';
}
function acceptHolidaySwitch(){ lsSet('holidayShown', currentHoliday() || ''); applyHoliday(); }
function dismissHolidayTip(){ lsSet('holidayTipDismissed', currentHoliday() || 'none'); updateHolidayTip(); }

function applyHoliday(){
  const key = effectiveHoliday();
  const h = key ? hol(key) : null;
  const changed = key !== activeHolidayKey;
  activeHolidayKey = key;
  const root = document.documentElement;
  if(h){
    const acc = h.accent || (isDark() ? h.dark : h.light);
    root.dataset.holiday = key;
    root.style.setProperty('--accent', acc);
    root.style.setProperty('--fab', acc);
    root.style.setProperty('--badge', '"' + h.badge + '"');
  } else {
    delete root.dataset.holiday;
    ['--accent','--fab','--badge'].forEach(v => root.style.removeProperty(v));
  }
  if(changed) buildFx(h);
  applyTitleFont();
  refreshAppIcon();
  renderStickers();
  updateHolidayTip();
}
function buildFx(h){
  const fx = document.getElementById('fx');
  fx.innerHTML = '';
  if(!h || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const n = 10;
  for(let i = 0; i < n; i++){
    const sp = document.createElement('span');
    sp.textContent = h.fx[i % h.fx.length];
    const dur = 11 + Math.random() * 10;
    sp.style.left = (Math.random() * 100) + '%';
    sp.style.fontSize = (13 + Math.random() * 9) + 'px';
    sp.style.animationDuration = dur + 's';
    sp.style.animationDelay = (-Math.random() * dur) + 's';
    sp.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    sp.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
    fx.appendChild(sp);
  }

// ===== Talking to the Apps Script for holiday settings =====
function jsonpCall(params, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = 'cfgCb_' + (++callbackCounter);
    const script = document.createElement('script');
    const cleanup = () => { clearTimeout(t); delete window[cb]; script.remove(); };
    const t = setTimeout(() => { cleanup(); reject(new Error('Timed out')); }, timeoutMs || 20000);
    window[cb] = d => { cleanup(); resolve(d); };
    script.onerror = () => { cleanup(); reject(new Error('Could not reach the Apps Script')); };
    script.src = APPS_SCRIPT_URL + '?' + Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&') + '&callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(script);
  });
}
async function saveHoliday(key, fields){
  const r = await jsonpCall(Object.assign({action:'saveHoliday', key:key}, fields));
  if(!r || !r.ok) throw new Error(r && r.error ? r.error : 'Save failed — paste in the newest Apps Script and redeploy');
}
async function saveHolidayIcon(key, dataUri){
  await fetch(APPS_SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'saveHolidayIcon', key:key, icon:dataUri})});
  // The POST response can't be read from here, so re-read the sheet to confirm it landed.
  await new Promise(r => setTimeout(r, 2500));
  const d = await jsonpCall({action:'holidays'});
  const got = (d && d.holidayIcons && d.holidayIcons[key]) || '';
  if(got !== dataUri) throw new Error('Icon didn\'t save — make sure the newest Apps Script is deployed');
}
function resizeIconFile(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 180, c = document.createElement('canvas'); c.width = c.height = S;
      const ctx = c.getContext('2d');
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let out = c.toDataURL('image/png');
      if(out.length > 45000){
        ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, S, S);
        out = c.toDataURL('image/jpeg', 0.9);
        if(out.length > 45000) out = c.toDataURL('image/jpeg', 0.7);
      }
      out.length > 48000 ? reject(new Error('Image is too detailed — try a simpler one')) : resolve(out);
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}

function parseSpec(spec){
  spec = String(spec || '').trim().toLowerCase();
  let m = spec.match(/^(\d{1,2})[-\/](\d{1,2})$/);
  if(m) return {t:'date', m:Number(m[1]), d:Number(m[2]), o:0};
  m = spec.match(/^(easter|thanksgiving)\s*([+-]\s*\d+)?$/);
  if(m) return {t:m[1], m:1, d:1, o:parseInt((m[2] || '0').replace(/\s/g,''), 10) || 0};
  return {t:'date', m:1, d:1, o:0};
}

      '<input id="' + id + '_day" class="ed-input" type="number" min="1" max="31" value="' + sp.d + '" style="width:64px"></span>' +

function agoText(ms){
  const m = Math.max(0, Math.floor(ms / 60000));

let ringLeft = null;
// The ring "stretches" toward the new cat (leading edge moves first), then the
// trailing edge catches up and it settles — no overshoot, a little squash.
function positionCatRing(animate){
  const el = document.getElementById('catTabs');
  const ring = el.querySelector('.cat-ring'), cell = el.querySelector('.cat-cell.active');
  if(!ring || !cell || !cell.offsetWidth) return;
  const size = 72;
  const er = el.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const target = cr.left - er.left + cr.width/2 - size/2;
  ring.getAnimations().forEach(a => a.cancel());
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!animate || ringLeft === null || reduced || Math.abs(target - ringLeft) < 1){
    ring.style.left = target + 'px'; ring.style.width = size + 'px'; ringLeft = target; return;
  }
  const from = ringLeft, lo = Math.min(from, target), span = Math.abs(target - from) + size;
  ring.animate([
    {left: from + 'px',   width: size + 'px', transform: 'scaleY(1)'},
    {left: lo + 'px',     width: span + 'px', transform: 'scaleY(0.86)', offset: 0.5, easing: 'cubic-bezier(.25,.1,.25,1)'},
    {left: target + 'px', width: size + 'px', transform: 'scaleY(1)'}
  ], {duration: 480, easing: 'cubic-bezier(.4,0,.2,1)'});
  ring.style.left = target + 'px'; ring.style.width = size + 'px'; ringLeft = target;
}

// Combines rain intensity, weather code, and wind gusts into a single 0–4
// "how loud/disruptive was it" score — a thunderstorm-flagged hour always
// ranks highest regardless of rain amount, since noise is what matters here.
function stormSeverity(code, precipMM, gustKmh){
  precipMM = precipMM || 0;
  gustKmh = gustKmh || 0;
  if(code >= 95) return 4;                              // thunderstorm
  if(precipMM >= 7.6 || gustKmh >= 70) return 3;         // heavy rain / damaging gusts
  if(precipMM >= 2.5 || gustKmh >= 55) return 2;         // moderate rain / strong gusts
  if(precipMM > 0 || gustKmh >= 40) return 1;            // light rain / genuinely noticeable wind
  return 0;                                              // calm — routine breezy days shouldn't register
}

let weatherByDate = {};
async function loadWeather(earliestDateKey){
  try{
    const today = new Date();
    const earliest = new Date(earliestDateKey + 'T00:00:00');
    const daysBack = Math.ceil((today - earliest) / 86400000) + 2;
    const pastDays = Math.min(92, Math.max(7, daysBack));
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + WEATHER_LAT + '&longitude=' + WEATHER_LON
      + '&hourly=precipitation,rain,weathercode,windspeed_10m,windgusts_10m'
      + '&daily=sunrise,sunset'
      + '&past_days=' + pastDays + '&forecast_days=1&timezone=auto';

    const res = await fetch(url);
    if(!res.ok) throw new Error('Weather API responded ' + res.status);
    const data = await res.json();

    const byDate = {};
    const times = data.hourly.time;
    for(let i=0; i<times.length; i++){
      const dt = new Date(times[i]);
      const dKey = dateKeyFromDate(dt);
      if(!byDate[dKey]) byDate[dKey] = {hours: {}};
      byDate[dKey].hours[dt.getHours()] = {
        time: dt,
        precip: data.hourly.precipitation[i],
        code: data.hourly.weathercode[i],
        gust: data.hourly.windgusts_10m[i],
        severity: stormSeverity(data.hourly.weathercode[i], data.hourly.precipitation[i], data.hourly.windgusts_10m[i])
      };
    }
    data.daily.time.forEach((dKey, i) => {
      if(!byDate[dKey]) byDate[dKey] = {hours: {}};
      byDate[dKey].sunrise = new Date(data.daily.sunrise[i]);
      byDate[dKey].sunset = new Date(data.daily.sunset[i]);
    });

    weatherByDate = byDate;
    if(currentView === 'day') renderCurrentView(true);
  }catch(e){
    console.error('Weather load failed (app still works without it):', e);
  }
}

// A real default icon that works everywhere (including iOS home screen)
// without depending on the sheet-photo test succeeding — drawn locally as a
// PNG via canvas, so no external file/hosting is needed. Overridden
// automatically later if the sheet provides a real photo.
function generateDefaultIcon(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,512,512);
  grad.addColorStop(0, '#3a6b63');
  grad.addColorStop(1, '#1e2624');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(0,0,512,512,96) : ctx.rect(0,0,512,512);
  ctx.fill();
  ctx.font = '300px -apple-system, Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐾', 256, 290);
  return c.toDataURL('image/png');
}

function submitStressEvent(){
  const timeStr = document.getElementById('eventTime').value;
  const note = document.getElementById('eventLabel').value.trim();
  const status = document.getElementById('eventFormStatus');
  if(!timeStr){
    status.textContent = 'Choose a date/time.';
    return;
  }
  const isoTime = new Date(timeStr).toISOString();
  const cat = CATS.length > 1 ? document.getElementById('entryCat').value : CATS[0];

  const params = { action: 'addEntry', entryType: currentEntryType, timestamp: isoTime, cat: cat };
  if(currentEntryType === 'pee'){
    params.rating = sizeValues.peeSizeRow;
    params.note = note;
  } else if(currentEntryType === 'poop'){
    params.rating = poopAmountValue;
    params.note = note;
  } else if(currentEntryType === 'straining'){
    const endStr = document.getElementById('strainEndTime').value;
    if(!endStr){ status.textContent = 'Choose an end time.'; return; }
    const duration = Math.round((new Date(endStr) - new Date(timeStr)) / 60000);
    if(!duration || duration <= 0){
      status.textContent = 'End time must be after start time.';
      return;
    }
    params.duration = duration;
    params.note = note;
  } else {
    if(!note){
      status.textContent = 'Describe what happened.';
      return;
    }
    params.label = note;
    params.rating = sizeValues.stressSizeRow;
  }

  const saveBtn = document.getElementById('saveEntryBtn');
  if(saveBtn.disabled) return;
  saveBtn.disabled = true;
  status.textContent = 'Saving…';
  const cbName = 'addEventCallback_' + (++callbackCounter);
  const timeout = setTimeout(() => {
    if(window[cbName]){ status.textContent = 'Timed out saving. Try again.'; saveBtn.disabled = false; delete window[cbName]; }
  }, 8000);

  window[cbName] = function(result){
    clearTimeout(timeout);
    delete window[cbName];
    script.remove();
    if(result && result.error){
      status.textContent = 'Could not save: ' + result.error; saveBtn.disabled = false;
      return;
    }
    status.textContent = 'Saved.';
    showToast('Saved · ' + cat + ' · ' + ({pee:'Pee',poop:'Poop',straining:'Straining',stress:'Stress'}[currentEntryType]));
    if(navigator.vibrate) navigator.vibrate(12);
    setTimeout(() => { toggleAddEventForm(); loadData(true); }, 250);
  };

  const url = APPS_SCRIPT_URL + '?' + Object.keys(params)
    .map(k => k + '=' + encodeURIComponent(params[k])).join('&')
    + '&callback=' + cbName;
  const script = document.createElement('script');
  script.src = url;
  script.onerror = function(){
    clearTimeout(timeout);
    delete window[cbName];
    status.textContent = 'Could not reach the Apps Script endpoint.'; saveBtn.disabled = false;
    script.remove();
  };
  document.head.appendChild(script);
}

let callbackCounter = 0;
function loadData(silent, attempt){
  attempt = attempt || 1;
  if(!silent) showState('loading', 'Connecting…');
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    showState('error', 'No data source configured yet — add your Apps Script Web App URL in the code.');
    return;
  }

  const cbName = 'sheetCallback_' + (++callbackCounter);
  function retryOrFail(msg){
    delete window[cbName];
    try{ script.remove(); }catch(e){}
    if(attempt < 3){
      if(!silent) showState('loading', 'Still connecting… (try ' + (attempt+1) + ' of 3)');
      loadData(silent, attempt + 1);
    } else {
      showState('error', msg + ' <br><br><button onclick="loadData()" style="padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:16px;">Try again</button>');
    }
  }
  const timeout = setTimeout(() => {
    if(window[cbName]) retryOrFail('Timed out reaching the Apps Script endpoint.');
  }, 20000);

  window[cbName] = function(data){
    clearTimeout(timeout);
    delete window[cbName];
    script.remove();
    try{
      if(data.error){ throw new Error(data.error); }

      allStraining = (data.straining || []).map(s => {
        const start = new Date(s.start);
        const end = new Date(s.end);
        return {date: dateKeyFromDate(start), start, end, note: s.note || '', cat: s.cat || ''};
      });
      allPee = (data.pee || []).map(p => {
        const time = new Date(p.time);
        return {date: dateKeyFromDate(time), time, rating: Number(p.rating), note: p.note || '', cat: p.cat || ''};
      });
      allPoop = (data.poop || []).map(p => {
        const time = new Date(p.time);
        return {date: dateKeyFromDate(time), time, rating: Number(p.rating), note: p.note || '', cat: p.cat || ''};
      });
      allStressEvents = (data.events || []).map(ev => {
        const time = new Date(ev.time);
        return {date: dateKeyFromDate(time), time, label: ev.label, rating: ev.rating, cat: ev.cat || ''};
      });
      applyCatFilter();
      updateLastSeen();
      if(data.holidays){ setHolidayConfig(data.holidays); applyHoliday(); }
      if(data.scriptVersion) scriptVersion = data.scriptVersion;
      if(data.logo){
        updateIconsAndManifest(data.logo);
      } else if(data.logoDebug){
        console.log('Logo not found — diagnostic info:', data.logoDebug);
      }
      if(CATS.length > 1) renderCatTabs();

      const eventDates = [...allStraining.map(s=>s.date), ...allPee.map(p=>p.date), ...allPoop.map(p=>p.date)];
      const todayKey = dateKeyFromDate(new Date());
      let minKey = eventDates.length ? eventDates.reduce((a,b) => a < b ? a : b) : todayKey;
      let maxKey = eventDates.length ? eventDates.reduce((a,b) => a > b ? a : b) : todayKey;
      if (todayKey > maxKey) maxKey = todayKey;

      const keepKey = (silent && dateList.length) ? dateList[currentDateIdx] : null;
      const keepView = silent ? currentView : 'list';
      const keepAnchor = silent ? monthAnchor : null;
      dateList = generateDateRange(minKey, maxKey);
      currentDateIdx = dateList.indexOf(keepKey || todayKey);
      if (currentDateIdx === -1) currentDateIdx = dateList.length - 1;
      monthAnchor = keepAnchor || new Date(dateList[currentDateIdx] + 'T00:00:00');

      populateDateSelect();
      showState('app');
      setView(keepView === 'day' ? 'day' : 'list');
      loadWeather(minKey);
      loadPhotos();
    }catch(e){
      console.error(e);
      showState('error', 'Could not load data: ' + e.message);
    }
  };

  const url = APPS_SCRIPT_URL + '?callback=' + cbName + '&_=' + Date.now();
  const script = document.createElement('script');
  script.src = url;
  script.onerror = function(){
    clearTimeout(timeout);
    if(window[cbName]) retryOrFail('Could not reach the Apps Script endpoint.');
  };
  document.head.appendChild(script);
}

// Day/List pill: drag (or flick) the pill toward the other option to select it.
(function(){
  const sw = document.getElementById('viewSwitch');
  const pill = sw.querySelector('.pill');
  sw.style.touchAction = 'none';
  let startX = null, startPos = 0, dragging = false, pid = null;
  sw.addEventListener('pointerdown', e => {
    startX = e.clientX; dragging = false; pid = e.pointerId;
    startPos = sw.dataset.view === 'day' ? 1 : 0;
  });
  sw.addEventListener('pointermove', e => {
    if(startX === null) return;
    const dx = e.clientX - startX;
    if(!dragging && Math.abs(dx) > 8){
      dragging = true;
      try{ sw.setPointerCapture(pid); }catch(_){}
      pill.style.transition = 'none';
    }
    if(dragging){
      const w = pill.offsetWidth;
      const pos = Math.max(0, Math.min(w, startPos * w + dx));
      pill.style.transform = 'translateX(' + pos + 'px)';
    }
  });
  function end(e){
    if(startX === null) return;
    const dx = e.clientX - startX;
    const was = dragging;
    startX = null; dragging = false;
    if(!was) return;               // plain tap: the buttons' own click handles it
    const w = pill.offsetWidth;
    const pos = Math.max(0, Math.min(w, startPos * w + dx));
    pill.style.transition = ''; pill.style.transform = '';
    const target = pos > w/2 ? 'day' : 'list';
    if(target !== currentView) setView(target);
  }
  sw.addEventListener('pointerup', end);
  sw.addEventListener('pointercancel', end);
})();

// Checks (when the app is opened/returned to, and every 2 minutes) whether the
// hosted file has a newer BUILD_STAMP than the one running, and offers a reload.
let remoteStamp = null;
const pageLoadedAt = Date.now();
async function checkForUpdate(isFirst){
  try{
    const res = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const m = (await res.text()).match(/const BUILD_STAMP = '([^']+)'/);
    if(!m) return;
    remoteStamp = m[1];
    const newer = new Date(remoteStamp) > new Date(BUILD_STAMP);
    // Just opened the app and it's stale (e.g. cached copy)? Update silently, once.
    // If the app was already open when a new version deployed, offer a Reload button instead.
    if(newer && isFirst === true && Date.now() - pageLoadedAt < 30000){
      let tried = null; try{ tried = sessionStorage.getItem('autoReloadFor'); }catch(e){}
      if(tried !== remoteStamp){
        try{ sessionStorage.setItem('autoReloadFor', remoteStamp); }catch(e){}
        reloadLatest();
        return;
      }
    }
    document.getElementById('updateBanner').style.display = newer ? 'flex' : 'none';
  }catch(e){ /* offline or file:// — ignore */ }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkForUpdate(); });
setInterval(() => checkForUpdate(), 120000);
setTimeout(() => checkForUpdate(true), 2500);

// Photos are fetched in a second, separate request after the app is already
// showing, so their size can never slow down or break the main data load.
let photosLoading = false;
function loadPhotos(){
  if(photosLoading) return;
  photosLoading = true;
  const cbName = 'photoCallback_' + (++callbackCounter);
  const script = document.createElement('script');
  const done = () => { photosLoading = false; clearTimeout(timeout); delete window[cbName]; script.remove(); };
  const timeout = setTimeout(() => { if(window[cbName]){ done(); console.warn('Photos timed out (they may be too large).'); } }, 45000);
  window[cbName] = function(data){
    done();
    if(!data || data.error){ console.warn('Photos:', data && data.error); return; }
    catPhotos = data.catPhotos || {};
    if(data.holidayIcons){ holidayIcons = data.holidayIcons; refreshAppIcon(); }
    if(data.scriptVersion) scriptVersion = data.scriptVersion;
    console.log('Photo diagnostics:', data.photoDebug);
    if(data.logo) updateIconsAndManifest(data.logo);
    renderCatTabs();
    };
  script.onerror = () => { done(); console.warn('Could not load photos.'); };
  script.src = APPS_SCRIPT_URL + '?action=photos&callback=' + cbName + '&_=' + Date.now();
  document.head.appendChild(script);
}

function escapeHtml(s){

function dateKeyFromDate(d){

}
function setView(view){
  const prev = currentView;

  currentView = view;
  document.getElementById('viewSwitch').dataset.view = view;
  ['tabDay','tabList'].forEach(id => {

function shiftPeriod(delta){
  if(currentView === 'list') return; // no period concept for the list view
  navDirection = delta;
  if(currentView === 'day'){ shiftDay(delta); return; }
  if(!monthAnchor) return;
  if(currentView === 'week'){ monthAnchor.setDate(monthAnchor.getDate() + delta*7); }
  else if(currentView === 'month'){ monthAnchor.setMonth(monthAnchor.getMonth() + delta); }
  else { monthAnchor.setFullYear(monthAnchor.getFullYear() + delta); }
  renderCurrentView();
}

function shiftDay(delta){
  if(!dateList.length) return;
  navDirection = delta;
  currentDateIdx = Math.max(0, Math.min(dateList.length-1, currentDateIdx + delta));
  document.getElementById('dateSelect').value = currentDateIdx;
  monthAnchor = new Date(dateList[currentDateIdx] + 'T00:00:00');
  renderCurrentView();
}

function goToToday(){
  if(!dateList.length) return;
  const todayKey = dateKeyFromDate(new Date());
  let idx = dateList.indexOf(todayKey);
  if(idx === -1) idx = dateList.length - 1;
  navDirection = idx >= currentDateIdx ? 1 : -1;
  currentDateIdx = idx;
  document.getElementById('dateSelect').value = currentDateIdx;
  monthAnchor = new Date(dateList[currentDateIdx] + 'T00:00:00');

function collectRows(lo, hi, type){
  let rows = [];
  const c = x => x.cat || CATS[0];
  if(type === 'all' || type === 'straining'){
    straining.forEach(x => rows.push({date:x.date, time:x.start, cat:c(x), type:'🚽 Straining',
      detail: Math.round((x.end - x.start)/60000) + ' min', note:x.note||''}));
  }
  if(type === 'all' || type === 'pee'){
    pee.forEach(x => rows.push({date:x.date, time:x.time, cat:c(x), type:'💧 Pee',
      detail:'Size ' + x.rating + '/6', note:x.note||''}));
  }
  if(type === 'all' || type === 'poop'){
    poop.forEach(x => rows.push({date:x.date, time:x.time, cat:c(x), type:'💩 Poop',
      detail:poopAmountLabel(x.rating), note:x.note||''}));
  }
  if(lo) rows = rows.filter(r => r.date >= lo);
  if(hi) rows = rows.filter(r => r.date <= hi);
  return rows;
}

function buildEntryTable(rows, sortDir){
  // Days follow the chosen direction; times inside each day always run morning → night.
  const byDay = {};
  rows.forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
  const days = Object.keys(byDay).sort();
  if(sortDir === 'desc') days.reverse();
  let html = '<table class="list-table"><thead><tr><th>Time</th><th>Type</th><th>Detail</th><th>Note</th></tr></thead><tbody>';
  days.forEach(d => {
    html += '<tr class="list-day-header"><td colspan="4">' + dayHeading(d) + '</td></tr>';
    byDay[d].sort((a,b) => a.time - b.time).forEach(r => {
      html += '<tr><td>' + fmtTime(r.time) + '</td><td>' + r.type + '</td><td>' + r.detail + '</td><td>' + escapeHtml(r.note) + '</td></tr>';
    });
  });
  return html + '</tbody></table>';
}

function weekDates(anchor){
  const start = new Date(anchor);
  start.setDate(start.getDate() - start.getDay()); // back to Sunday
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    out.push(dateKeyFromDate(d));
  }
  return out;
}

function monthDates(anchor){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const out = [];
  for(let d=1; d<=daysInMonth; d++){
    out.push(dateKeyFromDate(new Date(y,m,d)));
  }
  return out;
}

      peeCount: p.length,
      peeSum: p.reduce((sum,x) => sum + x.rating, 0)
    };
  });
}

// ---- Stats ----

// Pee size 4–6 reads as normal (teal); below 4 it interpolates progressively
// toward red as it drops to 1 — a smaller spot is the thing worth noticing.
function isDark(){ return document.documentElement.dataset.theme === 'dark'; }
function peeColor(v){
  const good = isDark() ? '#4db6ae' : '#2c6e6b', bad = isDark() ? '#e8785d' : '#a8412a';
  if(v >= 4) return good;
  const t = Math.max(0, Math.min(1, (4 - v) / 3));
  return d3.interpolateRgb(good, bad)(t);
}

function warnStyleFor(level){
  if(level === 2) return 'background:rgba(168,65,42,0.12);border-color:var(--error);';
  if(level === 1) return 'background:rgba(201,154,58,0.16);border-color:#c99a3a;';
  return '';
}

function renderStatsGrid(stats){
  const row = document.getElementById('statsRow');
  row.innerHTML = '';
  stats.forEach(s => {
    const div = document.createElement('div');
    if(s.type === 'bar'){
      div.className = 'stat';
      const pct = Math.max(0, Math.min(100, (s.value/6)*100));
      const color = peeColor(s.value);
      div.innerHTML =
        '<div class="num" style="color:'+color+';">'+s.value.toFixed(1)+'</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>' +
        '<div class="lbl" style="margin-top:4px;">'+s.lbl+'</div>';
    } else {
      div.className = 'stat';
      div.setAttribute('style', warnStyleFor(s.warnLevel || 0));
      div.innerHTML = '<div class="num">'+s.num+'</div><div class="lbl">'+s.lbl+'</div>';
    }
    row.appendChild(div);
  });
}

// Looks at gaps between consecutive pees in the FULL chronological timeline
// (not filtered to a single day first), so a gap spanning midnight — e.g.
// yesterday's last pee to today's first — correctly reads as one full gap
// instead of being invisible on both sides of the day boundary.
function maxPeeGapHours(date){
  const sortedAll = [...pee].sort((a,b) => a.time - b.time);
  let maxGap = null;
  for(let i=0; i<sortedAll.length; i++){
    if(sortedAll[i].date === date && i > 0){
      const gap = (sortedAll[i].time - sortedAll[i-1].time) / 3600000;
      maxGap = maxGap === null ? gap : Math.max(maxGap, gap);
    }
  }
  return maxGap;
}

function renderDayStats(date){
  const dayStraining = straining.filter(s => s.date === date);
  const dayPee = pee.filter(p => p.date === date);
  const totalMin = dayStraining.reduce((sum,s) => sum + (s.end - s.start)/60000, 0);
  const avgRating = dayPee.length ? (dayPee.reduce((s,p)=>s+p.rating,0)/dayPee.length) : 0;
  const durations = dayStraining.map(s => Math.round((s.end - s.start)/60000));
  const ratings = dayPee.map(p => p.rating);
  const longestStraining = durations.length ? Math.max(...durations) : null;
  const gapHours = maxPeeGapHours(date);

  const peeCountWarn = dayPee.length && (dayPee.length < PEE_COUNT_LOW || dayPee.length > PEE_COUNT_HIGH) ? 2 : 0;
  const gapWarn = gapHours === null ? 0 : (gapHours > MAX_PEE_GAP_HOURS ? 2 : (gapHours > MAX_PEE_GAP_HOURS*0.75 ? 1 : 0));
  const strainWarn = longestStraining === null ? 0 : (longestStraining > MAX_STRAINING_MIN ? 2 : (longestStraining > MAX_STRAINING_MIN*0.7 ? 1 : 0));

  const stats = [
    {num: dayStraining.length, lbl: 'Straining episodes'},
    {num: Math.round(totalMin) + ' min', lbl: 'Total straining'},
    {num: dayPee.length, lbl: 'Pee events', warnLevel: peeCountWarn},
    {num: durations.length ? Math.min(...durations) + ' min' : '—', lbl: 'Shortest straining'},
    {num: longestStraining !== null ? longestStraining + ' min' : '—', lbl: 'Longest straining', warnLevel: strainWarn},
    {num: gapHours !== null ? gapHours.toFixed(1) + 'h' : '—', lbl: 'Longest gap between pees', warnLevel: gapWarn}
  ];
  if(dayPee.length){
    stats.push({type:'bar', value: avgRating, lbl: 'Avg spot size'});
    stats.push({type:'bar', value: Math.min(...ratings), lbl: 'Smallest pee'});
    stats.push({type:'bar', value: Math.max(...ratings), lbl: 'Largest pee'});
  }
  renderStatsGrid(stats);
}

function renderWeekStats(days){
  const wkStraining = straining.filter(s => days.includes(s.date));
  const wkPee = pee.filter(p => days.includes(p.date));
  const totalMin = wkStraining.reduce((sum,s) => sum + (s.end - s.start)/60000, 0);
  const avgRating = wkPee.length ? (wkPee.reduce((s,p)=>s+p.rating,0)/wkPee.length) : 0;
  const stats = [
    {num: wkStraining.length, lbl: 'Straining episodes'},
    {num: Math.round(totalMin) + ' min', lbl: 'Total straining'},
    {num: wkPee.length, lbl: 'Pee events'}
  ];
  if(wkPee.length) stats.push({type:'bar', value: avgRating, lbl: 'Avg spot size'});
  renderStatsGrid(stats);
}

function renderMonthStats(anchor){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const prefix = y + '-' + String(m+1).padStart(2,'0');
  const mStraining = straining.filter(s => s.date.startsWith(prefix));
  const mPee = pee.filter(p => p.date.startsWith(prefix));
  const totalMin = mStraining.reduce((sum,s) => sum + (s.end - s.start)/60000, 0);
  const avgRating = mPee.length ? (mPee.reduce((s,p)=>s+p.rating,0)/mPee.length) : 0;
  renderStatsGrid([
    {num: mStraining.length, lbl: 'Straining episodes'},
    {num: Math.round(totalMin) + ' min', lbl: 'Total straining'},
    {num: mPee.length, lbl: 'Pee events'},
    {num: mPee.length ? avgRating.toFixed(1) : '—', lbl: 'Avg spot size'}
  ]);
}

// Averages/max/min are computed per DAY across the whole year (not per
// month), since "average daily straining events" etc. is what's meaningful
// for spotting overall patterns.
function renderYearStats(anchor){
  const y = anchor.getFullYear();
  const yearDays = [];
  const start = new Date(y,0,1), end = new Date(y,11,31);
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const key = dateKeyFromDate(d);
    if(dayInRange(key)) yearDays.push(key);
  }
  if(!yearDays.length){
    renderStatsGrid([{num:'—', lbl:'No data this year'}]);
    return;
  }
  const perDay = computePerDay(yearDays);
  const strainCounts = perDay.map(d => straining.filter(s=>s.date===d.date).length);
  const strainMins = perDay.map(d => d.mins);
  const peeCounts = perDay.map(d => d.peeCount);

  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;

  renderStatsGrid([
    {num: avg(strainCounts).toFixed(1), lbl: 'Avg daily straining events'},
    {num: Math.max(...strainCounts), lbl: 'Max daily straining events'},
    {num: Math.min(...strainCounts), lbl: 'Min daily straining events'},
    {num: Math.round(avg(strainMins)) + ' min', lbl: 'Avg daily straining time'},
    {num: Math.round(Math.max(...strainMins)) + ' min', lbl: 'Max daily straining time'},
    {num: Math.round(Math.min(...strainMins)) + ' min', lbl: 'Min daily straining time'},
    {num: avg(peeCounts).toFixed(1), lbl: 'Avg daily pee events'},
    {num: Math.max(...peeCounts), lbl: 'Max daily pee events'},
    {num: Math.min(...peeCounts), lbl: 'Min daily pee events'}
  ]);
}

// ---- Tooltip ----

// Anchored just above the top of the scrub guide-line, at the same x
// position — so it moves left/right with your finger instead of sitting in
// one fixed spot (and specifically doesn't sit under the thumb, since it's
// pinned above the chart rather than at the touch point itself).
function showTooltip(clientX, clientY, lines){
  const tooltip = d3.select('#tooltip');
  const html = lines.join('<br>');
  const clampedX = Math.max(60, Math.min(clientX, window.innerWidth - 60));
  tooltip.style('opacity',1)
    .style('left', clampedX + 'px')
    .style('transform', 'translate(-50%, calc(-100% - 10px))')
    .style('top', clientY + 'px')
    .html(html);
}
let activeGuideLine = null;
function hideTooltip(){
  d3.select('#tooltip').style('opacity',0);
  if(activeGuideLine) activeGuideLine.style('opacity', 0);
}
document.addEventListener('click', hideTooltip);

// Large, clear number + a plain visual bar (no text on the bar itself) for
// any 1–6 style rating, used in place of "5.0/6" style text.

let clockPref = 'auto';
try{ clockPref = localStorage.getItem('clockPref') || 'auto'; }catch(e){}
function fmtTime(d){
  const o = {hour:'numeric', minute:'2-digit'};
  if(clockPref === '12') o.hourCycle = 'h12';
  else if(clockPref === '24'){ o.hourCycle = 'h23'; o.hour = '2-digit'; }
  return d.toLocaleTimeString(undefined, o);
}
function setClockPref(v){
  clockPref = v; try{ localStorage.setItem('clockPref', v); }catch(e){}
  syncSettingsUI(); if(dateList.length) renderCurrentView(true);
}

function getScrollParent(el){
  let node = el;
  while(node && node !== document.body && node !== document.documentElement){
    const style = window.getComputedStyle(node);
    if(/(auto|scroll)/.test(style.overflowY) && node.scrollHeight > node.clientHeight) return node;
    node = node.parentElement;
  }
  return document.scrollingElement || document.documentElement;
}

// Attaches scrub-only drag behavior to a chart overlay. Charts never
// complete a swipe/period-change themselves — that's handled by a separate
// zone (see setupSwipeZone) so a drag that starts on a chart always just
// reads data, no matter how far or which direction it moves.
// touch-action:none gives us full manual control of the scroll-vs-scrub
// decision (the browser's own pan-y heuristic handed off to scrolling far
// too eagerly during an intended scrub). Once a drag clearly commits to
// being vertical — past a deliberately high, tunable bar — we take over
// scrolling manually ourselves; short of that bar, everything scrubs.
// setPointerCapture keeps pointermove/pointerup targeting this exact overlay
// even if the finger drifts over other elements. onEnd always hides the
// tooltip and clears any highlight — nothing lingers after you let go.
const SCROLL_TAKEOVER_DY = 32;   // px of vertical travel before scroll can win
const SCROLL_TAKEOVER_RATIO = 2.2; // how much more vertical than horizontal it must be

function attachDragGestures(overlaySelection, onMove, onEnd){
  let mode = null; // null | 'scroll' (locks in once triggered; otherwise every move defaults to scrub)
  let startX = 0, startY = 0, scrollAnchorY = 0, scrollAnchorTop = 0, scrollEl = null;

  overlaySelection.style('cursor', 'crosshair');
  overlaySelection.style('touch-action', 'none');
  overlaySelection.on('pointerdown', function(event){
    event.stopPropagation();
    mode = null;
    startX = event.clientX; startY = event.clientY;
    scrollEl = getScrollParent(this);
    this.setPointerCapture(event.pointerId);
    const offsetX = event.offsetX ?? d3.pointer(event, this)[0];
    onMove(offsetX, event);
  });
  overlaySelection.on('pointermove', function(event){
    const dx = event.clientX - startX, dy = event.clientY - startY;
    if(mode !== 'scroll' &&
       Math.abs(dy) > SCROLL_TAKEOVER_DY && Math.abs(dy) > Math.abs(dx) * SCROLL_TAKEOVER_RATIO){
      mode = 'scroll';
      // Anchor both the pointer position and the scroll position at the exact
      // moment of takeover, so scrollTop is always computed as an absolute
      // function of total displacement since then — not accumulated frame by
      // frame, which was prone to drifting/oscillating.
      scrollAnchorY = event.clientY;
      scrollAnchorTop = scrollEl ? scrollEl.scrollTop : 0;
      hideTooltip();
      if(onEnd) onEnd();
    }
    if(mode === 'scroll'){
      event.stopPropagation();
      if(scrollEl) scrollEl.scrollTop = scrollAnchorTop - (event.clientY - scrollAnchorY);
      return;
    }
    // Default: scrub. No separate low-bar "commit" check — that was locking
    // out the scroll test almost instantly on any real touch's natural wobble.
    event.stopPropagation();
    const offsetX = event.offsetX ?? d3.pointer(event, this)[0];
    onMove(offsetX, event);
  });
  overlaySelection.on('pointerup pointerleave pointercancel', function(event){
    event.stopPropagation();
    hideTooltip();
    if(onEnd) onEnd();
    mode = null;
  });
  overlaySelection.on('click', function(event){ event.stopPropagation(); });
}

// ---- Day view ----

function dayHeading(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d), now = new Date();
  const diff = Math.round((new Date(y,m-1,d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if(diff === 0) return 'Today';
  if(diff === -1) return 'Yesterday';
  if(diff === 1) return 'Tomorrow';
  const mons = ['Jan.','Feb.','Mar.','Apr.','May','Jun.','Jul.','Aug.','Sep.','Oct.','Nov.','Dec.'];
  return dt.toLocaleDateString('en-US', {weekday:'long'}) + ', ' + mons[m-1] + ' ' + d;
}

// Compact table of the day's straining/pee/poop entries, shown by default
// under the chart rather than requiring a switch to the List tab.
function renderDayInlineList(date){
  const rows = [];

    cat: s.cat || CATS[0], time: s.start, type: '🚽 Straining', detail: Math.round((s.end-s.start)/60000) + ' min', note: s.note||''
  }));
  pee.filter(p=>p.date===date).forEach(p => rows.push({
    cat: p.cat || CATS[0], time: p.time, type: '💧 Pee', detail: 'Size ' + p.rating + '/6', note: p.note||''
  }));
  poop.filter(p=>p.date===date).forEach(p => rows.push({
    cat: p.cat || CATS[0], time: p.time, type: '💩 Poop', detail: poopAmountLabel(p.rating), note: p.note||''
  }));
  rows.sort((a,b) => a.time - b.time);

  const el = document.getElementById('dayInlineList');
  if(!rows.length){
    el.innerHTML = '<div class="empty-msg">No entries logged for this day.</div>';

  rows.forEach(r => {
    html += '<tr><td>' + fmtTime(r.time) + '</td><td>' + r.type + '</td><td>' + r.detail + '</td><td>' + escapeHtml(r.note) + '</td></tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

// Weather overlaid directly on the same plot as straining/pee (drawn first,
// underneath, so it reads as background context rather than competing for
// space). Fill uses a fixed vertical gradient — dark near the top of the
// plot, fading to transparent near the bottom — so a higher line naturally
// shows more of the dark end. Height+color alone convey intensity.
function drawWeatherArea(g, x, plotWidth, plotHeight, dayStart, weather, date){
  const hasWeather = weather && weather.hours && Object.keys(weather.hours).length > 0;
  if(!hasWeather) return () => null;

  const pts = [];
  for(let hr=0; hr<=24; hr++){
    const src = weather.hours[hr === 24 ? 23 : hr];
    pts.push({t: new Date(dayStart.getTime() + hr*3600000), sev: src ? src.severity : 0});
  }
  const anyWeather = pts.some(p => p.sev > 0);
  if(!anyWeather){
    g.append('text')
      .attr('x', plotWidth/2).attr('y', plotHeight - 14)
      .attr('text-anchor','middle').attr('fill','var(--ink-soft)').attr('font-size','12px')
      .text('No weather events today');
  }
  const ys = d3.scaleLinear().domain([0,4]).range([plotHeight, 0]);

  const gradId = 'wxgrad_' + date.replace(/-/g,'');
  const defs = g.append('defs');
  defs.append('linearGradient')
    .attr('id', gradId)
    .attr('gradientUnits', 'userSpaceOnUse')
    .attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', plotHeight)
    .selectAll('stop')
    .data([{o:'0%', c:(isDark() ? 'rgba(110,170,230,0.5)' : 'rgba(28,79,115,0.55)')}, {o:'100%', c:(isDark() ? 'rgba(110,170,230,0)' : 'rgba(58,111,156,0)')}])
    .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

  const areaGen = d3.area().curve(d3.curveMonotoneX)
    .x(d => x(d.t)).y0(plotHeight).y1(d => ys(d.sev));
  const lineGen = d3.line().curve(d3.curveMonotoneX)
    .x(d => x(d.t)).y(d => ys(d.sev));

  g.append('path').datum(pts).attr('d', areaGen).attr('fill', 'url(#' + gradId + ')');
  g.append('path').datum(pts).attr('d', lineGen).attr('fill', 'none')
    .attr('stroke', (isDark() ? 'rgba(130,185,240,0.9)' : 'rgba(28,79,115,0.8)')).attr('stroke-width', 1.5);

  return function(t){
    const w = weather.hours[t.getHours()];
    if(!w || w.severity === 0) return null;
    return ['Weather: gusts ' + Math.round(w.gust) + ' km/h, ' + w.precip.toFixed(1) + 'mm rain'];
  };
}

// Feeding times: full-height reference lines overlaid on the same plot —
// fixed schedule, not a magnitude, so just presence.
function drawFeedingLines(g, x, plotWidth, plotHeight, dayStart){
  const marks = FEEDING_TIMES.map(f => {
    const t = new Date(dayStart);
    t.setHours(f.hour, f.minute, 0, 0);
    return {time: t, label: f.label};
  });

  g.selectAll('.feedline').data(marks).enter().append('line')
    .attr('x1', d => x(d.time)).attr('x2', d => x(d.time))
    .attr('y1', -18).attr('y2', plotHeight)
    .attr('stroke', '#c99a3a').attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '4,3').style('opacity', 0.7);

  const flagW = 11, flagH = 9;
  const flagX = d => Math.max(0, Math.min(plotWidth, x(d.time)));
  g.selectAll('.feedflag').data(marks).enter().append('path')
    .attr('transform', d => `translate(${flagX(d)},-18)`)
    .attr('d', `M0,0 L${flagW},${flagH/2} L0,${flagH} Z`)
    .attr('fill', '#c99a3a');

  return function(t, offsetX){
    let nearest = null, dist = Infinity;
    marks.forEach(m => {
      const d = Math.abs(x(m.time) - offsetX);
      if(d < dist){ dist = d; nearest = m; }
    });
    if(nearest && dist < 20) return [nearest.label + ' · ' + fmtTime(nearest.time)];
    return null;
  };
}

// User-logged stressful/loud events: full-height lines overlaid on the same
// plot, one per event that day, labeled with whatever was typed when saving.
function drawStressEventLines(g, x, plotWidth, plotHeight, dayStart, weather, date){
  const dayEvents = stressEvents.filter(ev => ev.date === date);
  g.selectAll('.eventline').data(dayEvents).enter().append('line')
    .attr('x1', d => x(d.time)).attr('x2', d => x(d.time))
    .attr('y1', 0).attr('y2', plotHeight)
    .attr('stroke', 'var(--stress)').attr('stroke-width', 2)
    .style('opacity', 0.7);

  if(!dayEvents.length){
    g.append('text')
      .attr('x', plotWidth/2).attr('y', plotHeight - 14)
      .attr('text-anchor','middle').attr('fill','var(--ink-soft)').attr('font-size','12px')
      .text('No stressful events today');
    return () => null;
  }
  return function(t, offsetX){
    let nearest = null, dist = Infinity;
    dayEvents.forEach(ev => {
      const d = Math.abs(x(ev.time) - offsetX);
      if(d < dist){ dist = d; nearest = ev; }
    });
    if(nearest && dist < 20){
      let line = '⚡ ' + escapeHtml(nearest.label) + ' at ' + fmtTime(nearest.time);
      if(nearest.rating) line += ' · level ' + nearest.rating + '/6';
      return [line];
    }
    return null;
  };
}

// Shared Day-view chart: draws the straining/pee/poop core (bands, night
// gradient, axes) plus one optional overlay, at a fixed pixel-per-hour scale
// wide enough to need horizontal scrolling — a real scrollable timeline
// (native scroll, no custom gesture code) instead of squeezing 24 hours into
// one screen width. Tap any mark for details; tap elsewhere to dismiss.
const PX_PER_HOUR = 70;
function drawCoreDayChart(containerId, date, drawExtra){
  const area = document.getElementById(containerId);
  const scrollWrap = document.getElementById('chartScroll');
  const dayStraining = straining.filter(s => s.date === date);
  const dayPee = pee.filter(p => p.date === date);
  const dayPoop = poop.filter(p => p.date === date);
  const weather = weatherByDate[date];

  const dayStart = new Date(date + 'T00:00:00');
  // Next local midnight (not +24h): on daylight-saving change days the day is 23 or 25 hours long.
  const dayEnd = new Date(dayStart.getFullYear(), dayStart.getMonth(), dayStart.getDate() + 1);
  const dayHours = (dayEnd - dayStart) / 3600000;

  const margin = {top: 32, right: 16, bottom: 32, left: 38};
  const plotWidth = PX_PER_HOUR * dayHours;
  const width = plotWidth + margin.left + margin.right;
  const plotHeight = 260;

  const svg = d3.select(area).append('svg')
    .attr('width', width).attr('height', plotHeight + margin.top + margin.bottom);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleTime().domain([dayStart, dayEnd]).range([0, plotWidth]);
  const y = d3.scaleLinear().domain([0,6]).range([plotHeight, 0]);
  const poopY = d3.scaleLinear().domain([0,2]).range([plotHeight, 0]); // binary amount, own scale so the two levels are clearly distinct

  let bandT = new Date(dayStart), bandIdx = 0;
  const bands = [];
  while(bandT < dayEnd){
    const next = new Date(Math.min(bandT.getTime() + 15*60000, dayEnd.getTime()));
    bands.push({start: new Date(bandT), end: next, idx: bandIdx});
    bandT = next; bandIdx++;
  }
  g.selectAll('.band').data(bands).enter().append('rect')
    .attr('class','band')
    .attr('x', d => x(d.start))
    .attr('width', d => Math.max(0, x(d.end) - x(d.start)))
    .attr('y', 0).attr('height', plotHeight)
    .attr('fill', d => d.idx % 2 === 0 ? 'var(--band-a)' : 'var(--band-b)');

  // Night shading: mostly solid, with a short twilight transition and a
  // subtle deep-night vignette at the outer edges.
  if(weather && weather.sunrise && weather.sunset){
    const NIGHT_OPACITY = 0.09;
    const NIGHT_EDGE_OPACITY = 0.25;
    const TWILIGHT_MIN = 100;
    const nightColor = c => isDark() ? `rgba(0,0,0,${Math.min(1, c*2.4)})` : `rgba(16,22,46,${c})`;
    const twilightStart = new Date(weather.sunrise.getTime() - TWILIGHT_MIN*60000);
    const twilightEnd = new Date(weather.sunset.getTime() + TWILIGHT_MIN*60000);

    const defsNight = g.append('defs');
    const gradMorningId = 'nightAM_' + containerId + '_' + date.replace(/-/g,'');
    const gradEveningId = 'nightPM_' + containerId + '_' + date.replace(/-/g,'');
    const gradEdgeAMId = 'nightEdgeAM_' + containerId + '_' + date.replace(/-/g,'');
    const gradEdgePMId = 'nightEdgePM_' + containerId + '_' + date.replace(/-/g,'');

    defsNight.append('linearGradient')
      .attr('id', gradMorningId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(twilightStart)).attr('y1',0).attr('x2', x(weather.sunrise)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(NIGHT_OPACITY)},{o:'100%', c:nightColor(0)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    defsNight.append('linearGradient')
      .attr('id', gradEveningId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(weather.sunset)).attr('y1',0).attr('x2', x(twilightEnd)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(0)},{o:'100%', c:nightColor(NIGHT_OPACITY)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    defsNight.append('linearGradient')
      .attr('id', gradEdgeAMId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(dayStart)).attr('y1',0).attr('x2', x(twilightStart)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(NIGHT_EDGE_OPACITY)},{o:'100%', c:nightColor(NIGHT_OPACITY)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    defsNight.append('linearGradient')
      .attr('id', gradEdgePMId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(twilightEnd)).attr('y1',0).attr('x2', x(dayEnd)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(NIGHT_OPACITY)},{o:'100%', c:nightColor(NIGHT_EDGE_OPACITY)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    g.append('rect')
      .attr('x', x(dayStart)).attr('width', Math.max(0, x(twilightStart) - x(dayStart)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradEdgeAMId + ')');
    g.append('rect')
      .attr('x', x(twilightStart)).attr('width', Math.max(0, x(weather.sunrise) - x(twilightStart)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradMorningId + ')');
    g.append('rect')
      .attr('x', x(weather.sunset)).attr('width', Math.max(0, x(twilightEnd) - x(weather.sunset)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradEveningId + ')');
    g.append('rect')
      .attr('x', x(twilightEnd)).attr('width', Math.max(0, x(dayEnd) - x(twilightEnd)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradEdgePMId + ')');

    [weather.sunrise, weather.sunset].forEach(t => {
      g.append('line')
        .attr('x1', x(t)).attr('x2', x(t)).attr('y1', 0).attr('y2', plotHeight)
        .attr('stroke', 'var(--ink-soft)').attr('stroke-width', 1)
        .attr('stroke-dasharray', '2,3').style('opacity', 0.4);
    });
  }

  const extraTooltipFn = drawExtra ? drawExtra(g, x, plotWidth, plotHeight, dayStart, weather, date) : null;

  g.selectAll('.gridline').data([1,2,3,4,5,6]).enter().append('line')
    .attr('class','gridline')
    .attr('x1', 0).attr('x2', plotWidth)
    .attr('y1', d => y(d)).attr('y2', d => y(d));

  function hoursSinceSunrise(t){
    if(!weather || !weather.sunrise) return null;
    return (t - weather.sunrise) / 3600000;
  }

  g.selectAll('.strain').data(dayStraining).enter().append('rect')
    .attr('class','strain')
    .attr('x', d => x(d.start))
    .attr('width', d => Math.max(5, x(d.end) - x(d.start)))
    .attr('y', 0).attr('height', plotHeight)
    .attr('fill', 'var(--strain-soft)')
    .attr('stroke', 'var(--strain)').attr('stroke-width', 1);

  const barW = Math.max(8, Math.min(18, PX_PER_HOUR/5));
  g.selectAll('.pee').data(dayPee).enter().append('rect')
    .attr('class','pee')
    .attr('x', d => x(d.time) - barW/2)
    .attr('width', barW)
    .attr('y', d => y(d.rating))
    .attr('height', d => plotHeight - y(d.rating))
    .attr('rx', 3)
    .attr('fill', 'var(--pee)')
    .attr('stroke', 'var(--pee)').attr('stroke-width', 0.5);

  g.selectAll('.poop').data(dayPoop).enter().append('rect')
    .attr('class','poop')
    .attr('x', d => x(d.time) - barW/2 - barW - 2)
    .attr('width', barW)
    .attr('y', d => poopY(d.rating))
    .attr('height', d => plotHeight - poopY(d.rating))
    .attr('rx', 3)
    .attr('fill', 'var(--poop)')
    .attr('stroke', 'var(--poop-edge)').attr('stroke-width', 0.5);

  if(!dayStraining.length && !dayPee.length && !dayPoop.length){
    g.append('text')
      .attr('x', plotWidth/2).attr('y', plotHeight/2)
      .attr('text-anchor', 'middle').attr('fill', 'var(--ink-soft)').attr('font-size', '13px')
      .text('No straining, pee, or poop logged this day');
  }

  g.append('g').attr('class','axis')
    .attr('transform', `translate(0,${plotHeight})`)
    .call(d3.axisBottom(x).ticks(d3.timeHour.every(1)).tickFormat(d => fmtTime(d)));
  g.append('g').attr('class','axis')
    .call(d3.axisLeft(y).ticks(6).tickFormat(d3.format('d')));

  // Fixed center marker (pure CSS, see .day-marker-line) never moves — as you
  // scroll, whatever it's over is "active" and its details are shown
  // automatically below, no tap needed. Padding equal to half the viewport
  // is added on both sides of the content so even the very first/last
  // moment of the day can be scrolled to the center.
  const hitRadius = barW/2 + 4;
  function updateMarkerInfo(){
    const containerWidth = scrollWrap.clientWidth;
    const plotX = Math.max(0, Math.min(plotWidth, scrollWrap.scrollLeft));
    const t = x.invert(plotX);

    const overlaps = [];
    const containingStrain = dayStraining.find(s => t >= s.start && t <= s.end);
    if(containingStrain){
      const mins = Math.round((containingStrain.end - containingStrain.start)/60000);
      let line = '🚽 Straining ' + fmtTime(containingStrain.start) + '–' + fmtTime(containingStrain.end) + ' (' + mins + ' min)';
      if(containingStrain.note) line += ' — ' + escapeHtml(containingStrain.note);
      overlaps.push(line);
    }
    dayPee.forEach(p => {
      if(Math.abs(x(p.time) - plotX) <= hitRadius){
        let line = '💧 Pee at ' + fmtTime(p.time) + ' · size ' + p.rating + '/6';
        if(p.note) line += ' — ' + escapeHtml(p.note);
        overlaps.push(line);
      }
    });
    dayPoop.forEach(p => {
      if(Math.abs(x(p.time) - plotX) <= hitRadius){
        let line = '💩 Poop at ' + fmtTime(p.time) + ' · ' + poopAmountLabel(p.rating);
        if(p.note) line += ' — ' + escapeHtml(p.note);
        overlaps.push(line);
      }
    });
    const extraLines = extraTooltipFn ? extraTooltipFn(t, plotX) : null;
    if(extraLines) extraLines.forEach(l => overlaps.push(l));

    let html = '<span class="marker-time">' + fmtTime(t) + '</span>';
    const hrs = hoursSinceSunrise(t);
    if(hrs !== null){
      html += ' <span style="opacity:0.6;">(' + (hrs >= 0 ? hrs.toFixed(1) + 'h after sunrise' : Math.abs(hrs).toFixed(1) + 'h before sunrise') + ')</span>';
    }
    if(overlaps.length) html += '<br>' + overlaps.join('<br>');
    document.getElementById('dayMarkerInfo').innerHTML = html;
  }
  scrollWrap.addEventListener('scroll', updateMarkerInfo);

  // Auto-position: "now" if viewing today, otherwise the first logged event,
  // otherwise a reasonable default (6am) — centered under the fixed marker.
  requestAnimationFrame(() => {
    const containerWidth = scrollWrap.clientWidth;
    const halfPad = containerWidth / 2;
    // Spacers sized so scrollLeft maps 1:1 to plot x: scrollLeft 0 = 00:00 under the marker,
    // max scroll = 24:00. (content-box + explicit width so the padding is real scrollable space.)
    area.style.boxSizing = 'content-box';
    area.style.width = width + 'px';
    area.style.paddingLeft = Math.max(0, halfPad - margin.left) + 'px';
    area.style.paddingRight = Math.max(0, halfPad - margin.right) + 'px';

    let targetPlotX;
    const todayKey = dateKeyFromDate(new Date());
    if(date === todayKey){
      targetPlotX = x(new Date());
    } else {
      const firstEvent = [...dayStraining.map(s=>s.start), ...dayPee.map(p=>p.time), ...dayPoop.map(p=>p.time)]
        .sort((a,b)=>a-b)[0];
      targetPlotX = firstEvent ? x(firstEvent) : x(new Date(dayStart.getTime()+6*3600000));
    }
    scrollWrap.scrollLeft = Math.max(0, targetPlotX);
    updateMarkerInfo();
  });
}


// ---- Week & Month views: 3 charts each (straining time, pee count, pee total),
// styled and gestured the same way as Day view. ----

function renderMultiDayCharts(days){
  const container = document.getElementById('viewContainer');
  container.innerHTML =
    '<div class="chart-card"><h3>Total straining (min)</h3><div class="chart-canvas" id="chartMins"></div></div>' +
    '<div class="chart-card"><h3>Number of pee events</h3><div class="chart-canvas" id="chartPeeCount"></div></div>' +
    '<div class="chart-card"><h3>Total pee score (sum of sizes)</h3><div class="chart-canvas" id="chartPeeSum"></div></div>';

  const stats = computePerDay(days);
  drawBarChart('chartMins', stats, 'var(--strain)', d => d.mins, v => Math.round(v) + 'm');
  drawBarChart('chartPeeCount', stats, 'var(--pee)', d => d.peeCount, v => String(v));
  drawBarChart('chartPeeSum', stats, 'var(--pee)', d => d.peeSum, v => String(v));
}

function drawBarChart(containerId, stats, color, valueFn, formatFn, labelsOnly){
  const area = document.getElementById(containerId);
  const margin = {top: 18, right: 20, bottom: 24, left: 30};
  const width = Math.max(area.clientWidth || 320, 260);
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = 190;
  const n = stats.length;

  const values = stats.map(valueFn);
  const maxVal = Math.max(1, ...values);

  const svg = d3.select(area).append('svg')
    .attr('width', width).attr('height', plotHeight + margin.top + margin.bottom);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(stats.map(s => s.date)).range([0, plotWidth]).padding(n > 15 ? 0.15 : 0.35);
  const y = d3.scaleLinear().domain([0, maxVal]).range([plotHeight, 0]);

  const todayKey = todayKeyStr();
  const isWeek = n <= 7;
  const isMonthGranularity = !labelsOnly && n > 7;
  const tickEvery = n > 15 ? Math.ceil(n / 10) : 1;
  const tickVals = stats.map(s=>s.date).filter((_,i) => i % tickEvery === 0);

  // Alternate background shading per calendar week (Sun–Sat) so week
  // boundaries are visible across a month of daily bars.
  if(isMonthGranularity){
    let weekIdx = 0, prevDow = null;
    stats.forEach(s => {
      const [yy,mm,dd] = s.date.split('-').map(Number);
      const dow = new Date(yy,mm-1,dd).getDay();
      if(prevDow !== null && dow === 0) weekIdx++;
      prevDow = dow;
      g.append('rect')
        .attr('x', x(s.date)).attr('width', x.step())
        .attr('y', 0).attr('height', plotHeight)
        .attr('fill', weekIdx % 2 === 0 ? 'var(--week-band-a)' : 'var(--week-band-b)');
    });
  }

  g.append('g').attr('class','axis')
    .attr('transform', `translate(0,${plotHeight})`)
    .call(d3.axisBottom(x).tickValues(tickVals).tickFormat(d => {
      if(labelsOnly) return d;
      const [yy,mm,dd] = d.split('-').map(Number);
      const dt = new Date(yy,mm-1,dd);
      return isWeek ? dt.toLocaleDateString(undefined,{weekday:'short'}) : String(dd);
    }));
  g.append('g').attr('class','axis').call(d3.axisLeft(y).ticks(4));

  g.selectAll('.daybar').data(stats).enter().append('rect')
    .attr('class','daybar')
    .attr('x', d => x(d.date))
    .attr('width', x.bandwidth())
    .attr('y', d => y(valueFn(d)))
    .attr('height', d => plotHeight - y(valueFn(d)))
    .attr('rx', 3)
    .attr('fill', d => (labelsOnly || dayInRange(d.date)) ? color : 'var(--line)')
    .attr('opacity', d => d.date === todayKey ? 1 : 0.85)
    .style('cursor', d => (!labelsOnly && dayInRange(d.date)) ? 'pointer' : 'default')
    .on('click', function(event, d){
      event.stopPropagation();
      if(!labelsOnly && dayInRange(d.date)) jumpToDay(d.date);
    });

  const guideRect = g.append('rect')
    .attr('y', 0).attr('height', plotHeight)
    .attr('fill', 'none').attr('stroke', 'var(--ink)').attr('stroke-width', 1.5)
    .style('opacity', 0).style('pointer-events', 'none');

  function updateScrub(offsetX){
    const idx = Math.max(0, Math.min(n-1, Math.floor(offsetX / (plotWidth / n))));
    const d = stats[idx];
    guideRect.attr('x', x(d.date)).attr('width', x.bandwidth()).style('opacity', 1);
    let label;
    if(labelsOnly){
      label = d.date;
    } else {
      const [yy,mm,dd] = d.date.split('-').map(Number);
      label = new Date(yy,mm-1,dd).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
    }
    return [label, formatFn(valueFn(d))];
  }

  const overlay = svg.append('rect')
    .attr('x', 0).attr('y', 0).attr('width', width).attr('height', plotHeight + margin.top + margin.bottom)
    .attr('fill', 'transparent');

  attachDragGestures(overlay,
    (rawOffsetX, event) => {
      const rect = svg.node().getBoundingClientRect();
      const clampedX = Math.max(0, Math.min(plotWidth, rawOffsetX - margin.left));
      showTooltip(rect.left + margin.left + clampedX, rect.top + margin.top, updateScrub(rawOffsetX - margin.left));
    },
    () => guideRect.style('opacity', 0)
  );
}

// Swipe between periods: dragging over the header/stats zone (never the
// chart itself — charts are scrub-only, see attachDragGestures above, so a
// swipe that starts on a chart can never complete a period change).
// Uses angle-based detection (how much MORE horizontal than vertical the
// motion is) rather than a fixed vertical cutoff, since a natural swipe's
// vertical wobble scales with how far you've dragged — a fixed pixel cutoff
// made longer swipes fail inconsistently. touch-action:none stops the page
// from trying to scroll during the gesture.
// Pull-to-refresh removed for now (was interfering with normal scrolling —
// its document-level pointer listeners were racing the chart's own scroll
// takeover). May revisit this later with a cleaner approach.

(function setupSwipeZone(){
  const zone = document.querySelector('.wrap');
  // Blocks native horizontal edge-swipe navigation in this zone while still
  // allowing vertical scroll-through. CSS touch-action correctly computes as
  // the intersection with descendant values, so this doesn't conflict with
  // chart overlays declaring touch-action:none — that turned out not to be
  // the actual scroll-jump bug (a wrong overscroll-behavior value was).
  zone.style.touchAction = 'pan-y';
  let startX = null, startY = null, tracking = false;

  function onDown(e){
    if(e.target.closest('.chart-canvas')) return;
    if(currentView !== 'day') return;
    if(e.target.closest('.sticky-top')) return; // header buttons / cat tabs / nav never swipe days
    if(e.target.closest('#addEventBackdrop')) return; // modal is open — nothing behind it should react
    startX = e.clientX; startY = e.clientY; tracking = true;
  }
  function onUp(e){
    if(!tracking || startX === null){ tracking = false; return; }
    tracking = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) < 55) return;
    if(Math.abs(dx) < Math.abs(dy) * 1.6) return; // too vertical — not a swipe
    if(dx < 0) shiftPeriod(1); else shiftPeriod(-1);
  }
  zone.addEventListener('pointerdown', onDown);
  zone.addEventListener('pointerup', onUp);
  zone.addEventListener('pointercancel', () => tracking = false);
})();

// Nothing behind the form may scroll: swallow touch-moves on the backdrop,
// and inside the card only allow scrolling when the card itself can scroll
// and isn't at an edge (stops scroll chaining into the page underneath).
(function(){
  const bd = document.getElementById('addEventBackdrop');
  const card = document.getElementById('addEventForm');
  let lastY = 0;
  bd.addEventListener('touchstart', e => { lastY = e.touches[0].clientY; }, {passive:true});
  bd.addEventListener('touchmove', e => {
    if(!card.contains(e.target)){ e.preventDefault(); return; }
    const dy = e.touches[0].clientY - lastY; lastY = e.touches[0].clientY;
    const canScroll = card.scrollHeight > card.clientHeight + 1;
    const atTop = card.scrollTop <= 0, atBottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 1;
    if(!canScroll || (dy > 0 && atTop) || (dy < 0 && atBottom)) e.preventDefault();
  }, {passive:false});
  bd.addEventListener('wheel', e => { if(!card.contains(e.target)) e.preventDefault(); }, {passive:false});
})();

let _lastW = window.innerWidth;
window.addEventListener('resize', () => {
  // iOS fires resize as toolbars collapse while scrolling; only re-layout on a real width change.
  if(window.innerWidth === _lastW) return;
  _lastW = window.innerWidth;
  if(document.getElementById('addEventBackdrop').style.display === 'none') renderCurrentView(true);
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && document.getElementById('addEventBackdrop').style.display !== 'none') toggleAddEventForm(); });
applyTheme();
applyTitleFont();
applyHoliday();
initDeviceMode();
updateIconsAndManifest(generateDefaultIcon());
loadData();
</script>

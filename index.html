<html lang="en">
<head>

<style>
  :root{
    --paper:#eef1ee;
    --ink:#1e2624;
    --ink-soft:#5b655f;
    --line:#d3d9d2;
    --card:#ffffff;
    --strain:#a8472a;
    --strain-soft:rgba(168,71,42,0.22);
    --pee:#2c6e6b;
    --accent:#3a6b63;
    --error:#a8412a;
    --band-a:#e6e9e3;
    --band-b:#eef1ee;
    --week-band-a:#d9ded3;
    --week-band-b:#f4f6f1;
  }
  *{box-sizing:border-box;}
  html{font-size:115%;}
  html,body{height:100%; overscroll-behavior-y:contain;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.45;
  }

  /* device preview toggle (testing only) */
  .device-toggle{
    position:sticky; top:0; z-index:40;
    display:flex; justify-content:center; gap:6px;
    padding:10px; background:#c9c4b5; border-bottom:1px solid #b7b2a1;
  }
  .device-toggle button{
    padding:6px 14px; border-radius:999px; border:1px solid #a39d89;
    background:#efece3; color:var(--ink); font-size:0.8rem; cursor:pointer;
  }
  .device-toggle button.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .stage{display:flex; justify-content:center; align-items:flex-start; padding:24px 12px 60px; min-height:calc(100vh - 46px);}
  .stage.native-stage{padding:0; min-height:100vh; display:block;}
  .device-frame{background:var(--paper); transition:all .15s ease;}
  .device-frame.desktop{
    width:100%; max-width:980px; border-radius:4px;
    height:auto; aspect-ratio:auto; overflow:visible;
  }
  .device-frame.mobile{
    aspect-ratio:9/19.5;
    height:min(844px, 82vh);
    width:auto;
    max-width:92vw;
    border-radius:36px;
    box-shadow:0 0 0 10px #1c1b19, 0 0 0 12px #3a3835;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior-y:contain;
  }
  /* Real phone / installed web app: no fake bezel, fills the actual screen.
     Safe-area padding keeps content clear of notches/home indicators. */
  .device-frame.native{
    width:100%; max-width:100%; height:auto; aspect-ratio:auto;
    border-radius:0; box-shadow:none; overflow:visible;
  }
  .device-frame.native .wrap{
    padding-bottom:max(50px, env(safe-area-inset-bottom));
    padding-left:max(18px, env(safe-area-inset-left));
    padding-right:max(18px, env(safe-area-inset-right));
  }
  .device-frame.native .sticky-top{
    padding-top:max(22px, env(safe-area-inset-top));
  }

  .wrap{padding:0 18px 50px;}
  /* Sticky nav/header bar: pinned at the top of the scrolling area at all
     times (navigation, day/period picker, add-event button) — and since it
     carries its own top padding (including the safe-area inset), the notch
     stays covered by a solid background no matter how far you've scrolled. */
  .sticky-top{
    position:sticky; top:0; z-index:30;
    background:var(--paper);
    padding-top:22px; padding-bottom:2px;
  }
  header{margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;}
  header h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-0.01em;}
  header .sub{color:var(--ink-soft);font-size:0.85rem;}

  /* Period-change animation */
  @keyframes slideInFromRight{
    from{opacity:0; transform:translateX(55px);}
    to{opacity:1; transform:translateX(0);}
  }
  @keyframes slideInFromLeft{
    from{opacity:0; transform:translateX(-55px);}
    to{opacity:1; transform:translateX(0);}
  }
  #periodContent.slide-fwd{animation:slideInFromRight .48s cubic-bezier(0.22,0.61,0.36,1);}
  #periodContent.slide-back{animation:slideInFromLeft .48s cubic-bezier(0.22,0.61,0.36,1);}

  .state-msg{padding:60px 16px;text-align:center;color:var(--ink-soft);font-size:0.95rem;}
  .state-msg.error{color:var(--error);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .view-tabs{display:flex;gap:4px;margin-bottom:12px;}
  .view-tabs button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:0.72rem;font-weight:600;cursor:pointer;}
  .view-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .day-nav{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .day-nav button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem;color:var(--ink);flex-shrink:0;}
  .day-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .day-nav select, .day-nav .period-label{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:0.85rem;color:var(--ink);}
  .day-nav select{flex:1; min-width:0;}
  .period-label{flex:1;text-align:center;font-weight:600;}
  .today-btn{width:auto !important;padding:0 12px;margin-left:auto;font-size:0.78rem;background:var(--card);color:var(--accent);border:1px solid var(--accent) !important;font-weight:600;}
  .today-btn.current{background:var(--accent);color:#fff;}
  .entry-type-btn{padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:0.82rem;font-weight:600;cursor:pointer;}
  .entry-type-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .swipe-hint{text-align:center;font-size:0.68rem;color:var(--ink-soft);opacity:0.6;margin:2px 0 10px;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px;flex:1;}
  .bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;border-radius:4px;transition:width .3s ease;}
  .stat .num{font-size:1.25rem;font-weight:700;}
  .stat .lbl{font-size:0.72rem;color:var(--ink-soft);}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px;margin-bottom:12px;}
  .chart-card h3{margin:0 0 8px;font-size:1rem;color:var(--ink);font-weight:800;text-align:center;letter-spacing:-0.01em;}
  .list-table{width:100%;border-collapse:collapse;font-size:0.82rem;}
  .list-table th{text-align:left;padding:6px 8px;color:var(--ink-soft);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;border-bottom:2px solid var(--ink);}
  .list-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .list-table tr:nth-child(even){background:var(--band-a);}
  .list-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .list-controls select{flex:1;min-width:100px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:0.78rem;color:var(--ink);}
  .list-day-header td{background:var(--ink);color:#fff;font-weight:700;font-size:0.78rem;padding:8px;border-bottom:none;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;padding:0 6px;font-size:0.76rem;color:var(--ink-soft);}
  .legend .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;}

  .tooltip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;font-size:0.78rem;opacity:0;transition:opacity .08s;z-index:50;white-space:nowrap;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,0.25);}

  .pull-refresh-bar{
    height:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    transition:height .28s cubic-bezier(0.22,0.61,0.36,1);
  }
  .pull-refresh-icon{
    font-size:1.4rem; line-height:1; opacity:0.35;
    transform:scale(0.6) rotate(0deg);
    transition:opacity .1s, transform .1s;
  }
  .pull-refresh-icon.armed{opacity:1;}
  .pull-refresh-bar.spinning{transition:none;}
  .pull-refresh-bar.spinning .pull-refresh-icon{
    animation:pullSpin 0.7s linear infinite;
    opacity:1; transform:scale(1);
  }
  @keyframes pullSpin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  .axis text{fill:var(--ink-soft);font-size:11px;}
  .axis path,.axis line{stroke:var(--line);}
  .gridline{stroke:var(--line);stroke-dasharray:2,3;}
</style>
</head>
<body>

<div class="device-toggle">
  <button id="btnMobile" onclick="setDevice('mobile')">Mobile</button>
  <button id="btnDesktop" onclick="setDevice('desktop')">Desktop</button>
</div>

<div class="stage" id="stage">
  <div class="device-frame mobile" id="deviceFrame">
    <div class="wrap">
      <div class="sticky-top" id="stickyTop">
        <header>
          <div style="display:flex;align-items:center;gap:10px;">
            <img id="logoImg" src="" alt="" style="display:none;width:32px;height:32px;border-radius:8px;object-fit:cover;">
            <h1>Puddle's Pee</h1>
          </div>
        </header>

        <div id="stickyNav" style="display:none;">
          <div class="view-tabs">
            <button id="tabDay" onclick="setView('day')">Day</button>
            <button id="tabWeek" onclick="setView('week')">Week</button>
            <button id="tabMonth" onclick="setView('month')">Month</button>
            <button id="tabYear" onclick="setView('year')">Year</button>
            <button id="tabList" onclick="setView('list')">List</button>
            <button id="addEventBtn" onclick="toggleAddEventForm()" style="flex:0 0 auto;width:36px;">+</button>
          </div>

          <div class="day-nav" id="dayNav">
            <button onclick="shiftPeriod(-1)" aria-label="Previous">‹</button>
            <select id="dateSelect" class="day-only" onchange="onDateSelect()"></select>
            <div id="periodLabel" class="period-label" style="display:none;"></div>
            <button onclick="shiftPeriod(1)" aria-label="Next">›</button>
            <button id="todayBtn" class="today-btn" onclick="goToToday()">Today</button>
          </div>
          <div class="swipe-hint" id="swipeHint">‹ swipe for previous/next day ›</div>
        </div>
      </div>

      <div id="stateArea">
        <div class="state-msg" id="stateMsg">
          <div class="spinner"></div>
          Connecting…
        </div>
      </div>

      <div id="appArea" style="display:none;">
        <div id="addEventForm" style="display:none;" class="chart-card">
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;gap:6px;">
              <button id="typePee" class="entry-type-btn" onclick="setEntryType('pee')" style="flex:1;">💧 Pee</button>
              <button id="typeStraining" class="entry-type-btn" onclick="setEntryType('straining')" style="flex:1;">🚽 Straining</button>
              <button id="typeStress" class="entry-type-btn" onclick="setEntryType('stress')" style="flex:1;">⚡ Stressor</button>
            </div>

            <label style="font-size:0.78rem;color:var(--ink-soft);">When?
              <input id="eventTime" type="datetime-local" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;margin-top:4px;">
            </label>

            <div id="fieldPeeRating" style="display:none;">
              <label style="font-size:0.78rem;color:var(--ink-soft);">Size (1–6)</label>
              <input id="peeRating" type="range" min="1" max="6" value="3" style="width:100%;">
              <div style="text-align:center;font-weight:700;" id="peeRatingVal">3</div>
            </div>

            <div id="fieldDuration" style="display:none;">
              <label style="font-size:0.78rem;color:var(--ink-soft);">Duration (minutes)
                <input id="strainDuration" type="number" min="1" placeholder="e.g. 10" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;margin-top:4px;">
              </label>
            </div>

            <div id="fieldStressRating" style="display:none;">
              <label style="font-size:0.78rem;color:var(--ink-soft);">Stress/noise level (1–6)</label>
              <input id="stressRating" type="range" min="1" max="6" value="3" style="width:100%;">
              <div style="text-align:center;font-weight:700;" id="stressRatingVal">3</div>
            </div>

            <label style="font-size:0.78rem;color:var(--ink-soft);" id="labelNoteWrap">
              <span id="noteLabelText">Note (optional)</span>
              <input id="eventLabel" type="text" placeholder="Garbage truck, parade, fireworks…" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;margin-top:4px;">
            </label>

            <div style="display:flex;gap:8px;">
              <button onclick="submitStressEvent()" style="flex:1;padding:10px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;">Save</button>
              <button onclick="toggleAddEventForm()" style="flex:1;padding:10px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;">Cancel</button>
            </div>
            <div id="eventFormStatus" style="font-size:0.76rem;color:var(--ink-soft);"></div>
          </div>
        </div>

        <div id="pullRefreshBar" class="pull-refresh-bar"><div class="pull-refresh-icon" id="pullRefreshIcon">🐾</div></div>
        <div id="periodContent">
          <div class="stats" id="statsRow"></div>
          <div id="viewContainer"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// Replace with your deployed Apps Script Web App URL.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyP6WvRGtwzsS5zjR2BiWMcwXbQZPFK90GQTD_7wuwbEdR56Vvjq3tEAkxKr7lS6uoR/exec';

// Approximate coordinates for weather + sunrise/sunset lookups: Howard Miller
// Public Library, Zeeland, MI — update if your location differs.
const WEATHER_LAT = 42.8081;
const WEATHER_LON = -86.0164;

// Recurring daily feeding schedule (not from the sheet — fixed reference times).
const FEEDING_TIMES = [
  {hour:0,  minute:0,  label:'Midnight snack'},
  {hour:6,  minute:0,  label:'Breakfast'},
  {hour:12, minute:0,  label:'Lunch'},
  {hour:18, minute:0,  label:'Dinner'},
  {hour:20, minute:0,  label:'Treat/med'}
];

// Adjustable heuristics for color-coding the stats — not medical guidance,
// just rough personal-tracking thresholds you can tune to whatever your vet
// suggests or whatever feels normal for your own cat.
const PEE_COUNT_LOW = 2;         // fewer pees/day than this gets flagged
const PEE_COUNT_HIGH = 6;        // more pees/day than this gets flagged
const MAX_PEE_GAP_HOURS = 8;      // longest gap between pees before flagging
const MAX_STRAINING_MIN = 10;     // straining episode length before flagging

let straining = [];
let pee = [];
let stressEvents = [];
let dateList = [];        // every calendar day from first entry through today
let currentDateIdx = 0;
let currentView = 'day';  // 'day' | 'week' | 'month'
let monthAnchor = null;   // Date used to anchor the month/week grid

document.addEventListener('securitypolicyviolation', function(e){
  console.error('Blocked by Content-Security-Policy:', e.blockedURI, '— directive:', e.violatedDirective);
});

function setDevice(mode){
  document.getElementById('deviceFrame').className = 'device-frame ' + mode;
  document.getElementById('btnMobile').classList.toggle('active', mode==='mobile');
  document.getElementById('btnDesktop').classList.toggle('active', mode==='desktop');
  renderCurrentView();
}

// On an actual phone (installed web app or mobile browser), skip the fake
// phone-bezel mockup entirely — it should just use the whole screen, no
// "app within an app." The bezel/toggle is only for testing on desktop.
function isRealMobileDevice(){
  const uaMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const coarsePointer = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  return uaMobile && coarsePointer;
}

function initDeviceMode(){
  if(isRealMobileDevice()){
    document.getElementById('deviceFrame').className = 'device-frame native';
    document.getElementById('stage').classList.add('native-stage');
    document.querySelector('.device-toggle').style.display = 'none';
  } else {
    setDevice('mobile');
  }
}

function showState(kind, message){
  const area = document.getElementById('stateArea');
  const app = document.getElementById('appArea');
  const nav = document.getElementById('stickyNav');
  if(kind === 'app'){
    area.style.display = 'none';
    app.style.display = 'block';
    nav.style.display = 'block';
    return;
  }
  app.style.display = 'none';
  nav.style.display = 'none';
  area.style.display = 'block';
  const spinner = kind === 'loading' ? '<div class="spinner"></div>' : '';
  area.innerHTML = '<div class="state-msg' + (kind==='error' ? ' error' : '') + '">' + spinner + message + '</div>';
}

function generateDateRange(startKey, endKey){
  const start = new Date(startKey + 'T00:00:00');
  const end = new Date(endKey + 'T00:00:00');
  const out = [];
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    out.push(dateKeyFromDate(new Date(d)));
  }
  return out;
}

// Combines rain intensity, weather code, and wind gusts into a single 0–4
// "how loud/disruptive was it" score — a thunderstorm-flagged hour always
// ranks highest regardless of rain amount, since noise is what matters here.
function stormSeverity(code, precipMM, gustKmh){
  precipMM = precipMM || 0;
  gustKmh = gustKmh || 0;
  if(code >= 95) return 4;                              // thunderstorm
  if(precipMM >= 7.6 || gustKmh >= 70) return 3;         // heavy rain / damaging gusts
  if(precipMM >= 2.5 || gustKmh >= 55) return 2;         // moderate rain / strong gusts
  if(precipMM > 0 || gustKmh >= 40) return 1;            // light rain / genuinely noticeable wind
  return 0;                                              // calm — routine breezy days shouldn't register
}

let weatherByDate = {};
async function loadWeather(earliestDateKey){
  try{
    const today = new Date();
    const earliest = new Date(earliestDateKey + 'T00:00:00');
    const daysBack = Math.ceil((today - earliest) / 86400000) + 2;
    const pastDays = Math.min(92, Math.max(7, daysBack));
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + WEATHER_LAT + '&longitude=' + WEATHER_LON
      + '&hourly=precipitation,rain,weathercode,windspeed_10m,windgusts_10m'
      + '&daily=sunrise,sunset'
      + '&past_days=' + pastDays + '&forecast_days=1&timezone=auto';

    const res = await fetch(url);
    if(!res.ok) throw new Error('Weather API responded ' + res.status);
    const data = await res.json();

    const byDate = {};
    const times = data.hourly.time;
    for(let i=0; i<times.length; i++){
      const dt = new Date(times[i]);
      const dKey = dateKeyFromDate(dt);
      if(!byDate[dKey]) byDate[dKey] = {hours: {}};
      byDate[dKey].hours[dt.getHours()] = {
        time: dt,
        precip: data.hourly.precipitation[i],
        code: data.hourly.weathercode[i],
        gust: data.hourly.windgusts_10m[i],
        severity: stormSeverity(data.hourly.weathercode[i], data.hourly.precipitation[i], data.hourly.windgusts_10m[i])
      };
    }
    data.daily.time.forEach((dKey, i) => {
      if(!byDate[dKey]) byDate[dKey] = {hours: {}};
      byDate[dKey].sunrise = new Date(data.daily.sunrise[i]);
      byDate[dKey].sunset = new Date(data.daily.sunset[i]);
    });

    weatherByDate = byDate;
    renderCurrentView();
  }catch(e){
    console.error('Weather load failed (app still works without it):', e);
  }
}

// Sets the favicon/apple-touch-icon directly from the sheet-provided image,
// and builds an in-memory manifest (via a Blob URL) so the standalone-display
// hint is present once this is actually hosted over HTTPS.
function updateIconsAndManifest(logoDataUri){
  document.getElementById('faviconLink').href = logoDataUri;
  document.getElementById('appleTouchIcon').href = logoDataUri;
  document.getElementById('logoImg').src = logoDataUri;
  document.getElementById('logoImg').style.display = '';

  const manifest = {
    name: "Cats",
    short_name: "Cats",
    start_url: '.',
    display: 'standalone',
    background_color: '#eef1ee',
    theme_color: '#1e2624',
    icons: [{src: logoDataUri, sizes: '512x512', type: 'image/png'}]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
}

// A real default icon that works everywhere (including iOS home screen)
// without depending on the sheet-photo test succeeding — drawn locally as a
// PNG via canvas, so no external file/hosting is needed. Overridden
// automatically later if the sheet provides a real photo.
function generateDefaultIcon(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,512,512);
  grad.addColorStop(0, '#3a6b63');
  grad.addColorStop(1, '#1e2624');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(0,0,512,512,96) : ctx.rect(0,0,512,512);
  ctx.fill();
  ctx.font = '300px -apple-system, Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐾', 256, 290);
  return c.toDataURL('image/png');
}

let currentEntryType = 'pee';

function setEntryType(type){
  currentEntryType = type;
  ['typePee','typeStraining','typeStress'].forEach(id => {
    document.getElementById(id).classList.toggle('active',

function toggleAddEventForm(){

document.addEventListener('input', function(e){

  if(e.target.id === 'stressRating') document.getElementById('stressRatingVal').textContent = e.target.value;

function submitStressEvent(){
  const timeStr = document.getElementById('eventTime').value;
  const note = document.getElementById('eventLabel').value.trim();
  const status = document.getElementById('eventFormStatus');
  if(!timeStr){
    status.textContent = 'Choose a date/time.';
    return;
  }
  const isoTime = new Date(timeStr).toISOString();

  const params = { action: 'addEntry', entryType: currentEntryType, timestamp: isoTime };
  if(currentEntryType === 'pee'){
    params.rating = document.getElementById('peeRating').value;
    params.note = note;
  } else if(currentEntryType === 'straining'){
    const duration = document.getElementById('strainDuration').value;
    if(!duration || Number(duration) <= 0){
      status.textContent = 'Enter a duration in minutes.';
      return;
    }
    params.duration = duration;
    params.note = note;
  } else {
    if(!note){
      status.textContent = 'Describe what happened.';
      return;
    }
    params.label = note;
    params.rating = document.getElementById('stressRating').value;
  }

  status.textContent = 'Saving…';
  const cbName = 'addEventCallback_' + (++callbackCounter);
  const timeout = setTimeout(() => {
    if(window[cbName]){ status.textContent = 'Timed out saving. Try again.'; delete window[cbName]; }
  }, 8000);

  window[cbName] = function(result){
    clearTimeout(timeout);
    delete window[cbName];
    script.remove();
    if(result && result.error){
      status.textContent = 'Could not save: ' + result.error;
      return;
    }
    status.textContent = 'Saved.';
    setTimeout(() => { toggleAddEventForm(); loadData(); }, 500);
  };

  const url = APPS_SCRIPT_URL + '?' + Object.keys(params)
    .map(k => k + '=' + encodeURIComponent(params[k])).join('&')
    + '&callback=' + cbName;
  const script = document.createElement('script');
  script.src = url;
  script.onerror = function(){
    clearTimeout(timeout);
    delete window[cbName];
    status.textContent = 'Could not reach the Apps Script endpoint.';
    script.remove();
  };
  document.head.appendChild(script);
}

let callbackCounter = 0;
function loadData(){
  showState('loading', 'Connecting…');
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    showState('error', 'No data source configured yet — add your Apps Script Web App URL in the code.');
    return;
  }

  const cbName = 'sheetCallback_' + (++callbackCounter);
  const timeout = setTimeout(() => {
    if(window[cbName]){
      showState('error', 'Timed out reaching the Apps Script endpoint. Check the URL and that it is deployed with access set to "Anyone".');
      delete window[cbName];
    }
  }, 8000);

  window[cbName] = function(data){
    clearTimeout(timeout);
    delete window[cbName];
    script.remove();
    try{
      if(data.error){ throw new Error(data.error); }

      straining = (data.straining || []).map(s => {
        const start = new Date(s.start);
        const end = new Date(s.end);
        return {date: dateKeyFromDate(start), start, end, note: s.note || ''};
      });
      pee = (data.pee || []).map(p => {
        const time = new Date(p.time);
        return {date: dateKeyFromDate(time), time, rating: Number(p.rating), note: p.note || ''};
      });
      stressEvents = (data.events || []).map(ev => {
        const time = new Date(ev.time);
        return {date: dateKeyFromDate(time), time, label: ev.label, rating: ev.rating};
      });
      if(data.logo){
        updateIconsAndManifest(data.logo);
      } else if(data.logoDebug){
        console.log('Logo not found — diagnostic info:', data.logoDebug);
      }

      const eventDates = [...straining.map(s=>s.date), ...pee.map(p=>p.date)];
      const todayKey = dateKeyFromDate(new Date());
      let minKey = eventDates.length ? eventDates.reduce((a,b) => a < b ? a : b) : todayKey;
      let maxKey = eventDates.length ? eventDates.reduce((a,b) => a > b ? a : b) : todayKey;
      if (todayKey > maxKey) maxKey = todayKey;

      dateList = generateDateRange(minKey, maxKey);
      currentDateIdx = dateList.indexOf(todayKey);
      if (currentDateIdx === -1) currentDateIdx = dateList.length - 1;
      monthAnchor = new Date(dateList[currentDateIdx] + 'T00:00:00');

      populateDateSelect();
      showState('app');
      setView('day');
      loadWeather(minKey);
    }catch(e){
      console.error(e);
      showState('error', 'Could not load data: ' + e.message);
    }
  };

  const url = APPS_SCRIPT_URL + '?callback=' + cbName;
  const script = document.createElement('script');
  script.src = url;
  script.onerror = function(){
    clearTimeout(timeout);
    delete window[cbName];
    showState('error', 'Could not reach the Apps Script endpoint. Check the URL and that it is deployed with access set to "Anyone".');
    script.remove();
  };
  document.head.appendChild(script);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function dateKeyFromDate(d){
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function populateDateSelect(){
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = '';
  dateList.forEach((d,i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const hasEvents = straining.some(s=>s.date===d) || pee.some(p=>p.date===d) || stressEvents.some(ev=>ev.date===d);
    opt.textContent = (hasEvents ? '● ' : '　 ') + formatDateLabel(d);
    sel.appendChild(opt);
  });
  sel.value = currentDateIdx;
}

function formatDateLabel(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}

function onDateSelect(){
  currentDateIdx = Number(document.getElementById('dateSelect').value);
  monthAnchor = new Date(dateList[currentDateIdx] + 'T00:00:00');
  renderCurrentView();
}

// ---- View switching ----

let navDirection = 1;

function setView(view){
  currentView = view;
  ['tabDay','tabWeek','tabMonth','tabYear','tabList'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === 'tab' + view.charAt(0).toUpperCase() + view.slice(1));
  });
  document.getElementById('dateSelect').style.display = view === 'day' ? '' : 'none';
  document.getElementById('periodLabel').style.display = view === 'day' ? 'none' : '';
  document.getElementById('dayNav').style.display = view === 'list' ? 'none' : 'flex';
  const hints = {day:'day', week:'week', month:'month', year:'year'};
  document.getElementById('swipeHint').style.display = view === 'list' ? 'none' : '';
  document.getElementById('swipeHint').textContent = view === 'list' ? '' : 'Drag chart to inspect · swipe further to change ' + hints[view];
  renderCurrentView();
}

function shiftPeriod(delta){
  if(currentView === 'list') return; // no period concept for the list view
  navDirection = delta;
  if(currentView === 'day'){ shiftDay(delta); return; }
  if(!monthAnchor) return;
  if(currentView === 'week'){ monthAnchor.setDate(monthAnchor.getDate() + delta*7); }
  else if(currentView === 'month'){ monthAnchor.setMonth(monthAnchor.getMonth() + delta); }
  else { monthAnchor.setFullYear(monthAnchor.getFullYear() + delta); }
  renderCurrentView();
}

function shiftDay(delta){
  if(!dateList.length) return;
  navDirection = delta;
  currentDateIdx = Math.max(0, Math.min(dateList.length-1, currentDateIdx + delta));
  document.getElementById('dateSelect').value = currentDateIdx;
  monthAnchor = new Date(dateList[currentDateIdx] + 'T00:00:00');
  renderCurrentView();
}

function goToToday(){
  if(!dateList.length) return;
  const todayKey = dateKeyFromDate(new Date());
  let idx = dateList.indexOf(todayKey);
  if(idx === -1) idx = dateList.length - 1;
  navDirection = idx >= currentDateIdx ? 1 : -1;
  currentDateIdx = idx;
  document.getElementById('dateSelect').value = currentDateIdx;
  monthAnchor = new Date(dateList[currentDateIdx] + 'T00:00:00');
  renderCurrentView();
}

function updateTodayButton(){
  const btn = document.getElementById('todayBtn');
  if(!btn || !dateList.length) return;
  const todayKey = dateKeyFromDate(new Date());
  btn.classList.toggle('current', dateList[currentDateIdx] === todayKey);
}

function playPeriodAnimation(){
  const vc = document.getElementById('periodContent');
  vc.classList.remove('slide-fwd','slide-back');
  void vc.offsetWidth; // restart animation
  vc.classList.add(navDirection >= 0 ? 'slide-fwd' : 'slide-back');
}

function renderCurrentView(){
  if(!dateList.length) return;
  updateTodayButton();
  if(currentView === 'day'){
    document.getElementById('periodLabel').textContent = '';
    renderDayStats(dateList[currentDateIdx]);
    renderDayView(dateList[currentDateIdx]);
  } else if(currentView === 'week'){
    const days = weekDates(monthAnchor);
    document.getElementById('periodLabel').textContent =
      formatDateLabel(days[0]) + ' – ' + formatDateLabel(days[6]);
    renderWeekStats(days);
    renderMultiDayCharts(days);
  } else if(currentView === 'month'){
    const days = monthDates(monthAnchor);
    document.getElementById('periodLabel').textContent =
      monthAnchor.toLocaleDateString(undefined, {month:'long', year:'numeric'});
    renderMonthStats(monthAnchor);
    renderMultiDayCharts(days);
  } else if(currentView === 'year'){
    document.getElementById('periodLabel').textContent = String(monthAnchor.getFullYear());
    renderYearStats(monthAnchor);
    renderYearView(monthAnchor);
  } else {
    document.getElementById('statsRow').innerHTML = '';
    renderListView();
  }
  if(currentView !== 'list') playPeriodAnimation();
}

// List view: every straining/pee entry, grouped by day with a controls bar
// for range/type filtering and sort direction — meant for quickly checking
// specifics or sharing with a vet, not for visual pattern-spotting.
let listSort = 'desc', listRange = 'all', listType = 'all';

function renderListView(){
  const container = document.getElementById('viewContainer');
  container.innerHTML =
    '<div class="chart-card">' +
      '<div class="list-controls">' +
        '<select id="listRangeSel" onchange="onListControlChange()">' +
          '<option value="all">All time</option>' +
          '<option value="week">This week</option>' +
          '<option value="month">This month</option>' +
          '<option value="year">This year</option>' +
        '</select>' +
        '<select id="listTypeSel" onchange="onListControlChange()">' +
          '<option value="all">All entries</option>' +
          '<option value="straining">Straining only</option>' +
          '<option value="pee">Pee only</option>' +
        '</select>' +
        '<select id="listSortSel" onchange="onListControlChange()">' +
          '<option value="desc">Newest first</option>' +
          '<option value="asc">Oldest first</option>' +
        '</select>' +
      '</div>' +
      '<div id="listBody"></div>' +
    '</div>';
  document.getElementById('listRangeSel').value = listRange;
  document.getElementById('listTypeSel').value = listType;
  document.getElementById('listSortSel').value = listSort;
  renderListBody();
}

function onListControlChange(){
  listRange = document.getElementById('listRangeSel').value;
  listType = document.getElementById('listTypeSel').value;
  listSort = document.getElementById('listSortSel').value;
  renderListBody();
}

function renderListBody(){
  const today = new Date();
  const todayKey = dateKeyFromDate(today);
  let minKeyBound = null;
  if(listRange === 'week'){
    const days = weekDates(today);
    minKeyBound = days[0];
  } else if(listRange === 'month'){
    minKeyBound = todayKey.slice(0,8) + '01';
  } else if(listRange === 'year'){
    minKeyBound = todayKey.slice(0,4) + '-01-01';
  }

  let rows = [];
  if(listType !== 'pee'){
    straining.forEach(s => rows.push({
      date: s.date, time: s.start, type: '🚽 Straining',
      detail: Math.round((s.end - s.start)/60000) + ' min',
      note: s.note || ''
    }));
  }
  if(listType !== 'straining'){
    pee.forEach(p => rows.push({
      date: p.date, time: p.time, type: '💧 Pee',
      detail: 'Size ' + p.rating + '/6',
      note: p.note || ''
    }));
  }
  if(minKeyBound){
    rows = rows.filter(r => r.date >= minKeyBound && r.date <= todayKey);
  }
  rows.sort((a,b) => listSort === 'desc' ? b.time - a.time : a.time - b.time);

  const body = document.getElementById('listBody');
  if(!rows.length){
    body.innerHTML = '<div class="empty-msg">No entries in this range.</div>';
    return;
  }

  let html = '<table class="list-table"><thead><tr>' +
    '<th>Time</th><th>Type</th><th>Detail</th><th>Note</th></tr></thead><tbody>';
  let lastDate = null;
  rows.forEach(r => {
    if(r.date !== lastDate){
      const [yy,mm,dd] = r.date.split('-').map(Number);
      const label = new Date(yy,mm-1,dd).toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
      html += '<tr class="list-day-header"><td colspan="4">' + label + '</td></tr>';
      lastDate = r.date;
    }
    html += '<tr><td>' + fmtTime(r.time) + '</td>' +
      '<td>' + r.type + '</td>' +
      '<td>' + r.detail + '</td>' +
      '<td>' + escapeHtml(r.note) + '</td></tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html;
}

function weekDates(anchor){
  const start = new Date(anchor);
  start.setDate(start.getDate() - start.getDay()); // back to Sunday
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    out.push(dateKeyFromDate(d));
  }
  return out;
}

function monthDates(anchor){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const out = [];
  for(let d=1; d<=daysInMonth; d++){
    out.push(dateKeyFromDate(new Date(y,m,d)));
  }
  return out;
}

function computePerDay(days){
  return days.map(dKey => {
    const s = straining.filter(x => x.date === dKey);
    const p = pee.filter(x => x.date === dKey);
    return {
      date: dKey,
      mins: s.reduce((sum,x) => sum + (x.end-x.start)/60000, 0),
      peeCount: p.length,
      peeSum: p.reduce((sum,x) => sum + x.rating, 0)
    };
  });
}

const todayKeyStr = () => dateKeyFromDate(new Date());

function dayInRange(key){
  return dateList.indexOf(key) !== -1;
}

function jumpToDay(key){
  if(!dayInRange(key)) return;
  currentDateIdx = dateList.indexOf(key);
  document.getElementById('dateSelect').value = currentDateIdx;
  monthAnchor = new Date(key + 'T00:00:00');
  setView('day');
}

// ---- Stats ----

// Pee size 4–6 reads as normal (teal); below 4 it interpolates progressively
// toward red as it drops to 1 — a smaller spot is the thing worth noticing.
function peeColor(v){
  if(v >= 4) return '#2c6e6b';
  const t = Math.max(0, Math.min(1, (4 - v) / 3));
  return d3.interpolateRgb('#2c6e6b', '#a8412a')(t);
}

function warnStyleFor(level){
  if(level === 2) return 'background:rgba(168,65,42,0.12);border-color:var(--error);';
  if(level === 1) return 'background:rgba(201,154,58,0.16);border-color:#c99a3a;';
  return '';
}

function renderStatsGrid(stats){
  const row = document.getElementById('statsRow');
  row.innerHTML = '';
  stats.forEach(s => {
    const div = document.createElement('div');
    if(s.type === 'bar'){
      div.className = 'stat';
      const pct = Math.max(0, Math.min(100, (s.value/6)*100));
      const color = peeColor(s.value);
      div.innerHTML =
        '<div class="num" style="color:'+color+';">'+s.value.toFixed(1)+'</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>' +
        '<div class="lbl" style="margin-top:4px;">'+s.lbl+'</div>';
    } else {
      div.className = 'stat';
      div.setAttribute('style', warnStyleFor(s.warnLevel || 0));
      div.innerHTML = '<div class="num">'+s.num+'</div><div class="lbl">'+s.lbl+'</div>';
    }
    row.appendChild(div);
  });
}

function maxPeeGapHours(dayPee){
  if(dayPee.length < 2) return null;
  const sorted = [...dayPee].sort((a,b) => a.time - b.time);
  let maxGap = 0;
  for(let i=1; i<sorted.length; i++){
    maxGap = Math.max(maxGap, (sorted[i].time - sorted[i-1].time)/3600000);
  }
  return maxGap;
}

function renderDayStats(date){
  const dayStraining = straining.filter(s => s.date === date);
  const dayPee = pee.filter(p => p.date === date);
  const totalMin = dayStraining.reduce((sum,s) => sum + (s.end - s.start)/60000, 0);
  const avgRating = dayPee.length ? (dayPee.reduce((s,p)=>s+p.rating,0)/dayPee.length) : 0;
  const durations = dayStraining.map(s => Math.round((s.end - s.start)/60000));
  const ratings = dayPee.map(p => p.rating);
  const longestStraining = durations.length ? Math.max(...durations) : null;
  const gapHours = maxPeeGapHours(dayPee);

  const peeCountWarn = dayPee.length && (dayPee.length < PEE_COUNT_LOW || dayPee.length > PEE_COUNT_HIGH) ? 2 : 0;
  const gapWarn = gapHours === null ? 0 : (gapHours > MAX_PEE_GAP_HOURS ? 2 : (gapHours > MAX_PEE_GAP_HOURS*0.75 ? 1 : 0));
  const strainWarn = longestStraining === null ? 0 : (longestStraining > MAX_STRAINING_MIN ? 2 : (longestStraining > MAX_STRAINING_MIN*0.7 ? 1 : 0));

  const stats = [
    {num: dayStraining.length, lbl: 'Straining episodes'},
    {num: Math.round(totalMin) + ' min', lbl: 'Total straining'},
    {num: dayPee.length, lbl: 'Pee events', warnLevel: peeCountWarn},
    {num: durations.length ? Math.min(...durations) + ' min' : '—', lbl: 'Shortest straining'},
    {num: longestStraining !== null ? longestStraining + ' min' : '—', lbl: 'Longest straining', warnLevel: strainWarn},
    {num: gapHours !== null ? gapHours.toFixed(1) + 'h' : '—', lbl: 'Longest gap between pees', warnLevel: gapWarn}
  ];
  if(dayPee.length){
    stats.push({type:'bar', value: avgRating, lbl: 'Avg spot size'});
    stats.push({type:'bar', value: Math.min(...ratings), lbl: 'Smallest pee'});
    stats.push({type:'bar', value: Math.max(...ratings), lbl: 'Largest pee'});
  }
  renderStatsGrid(stats);
}

function renderWeekStats(days){
  const wkStraining = straining.filter(s => days.includes(s.date));
  const wkPee = pee.filter(p => days.includes(p.date));
  const totalMin = wkStraining.reduce((sum,s) => sum + (s.end - s.start)/60000, 0);
  const avgRating = wkPee.length ? (wkPee.reduce((s,p)=>s+p.rating,0)/wkPee.length) : 0;
  const stats = [
    {num: wkStraining.length, lbl: 'Straining episodes'},
    {num: Math.round(totalMin) + ' min', lbl: 'Total straining'},
    {num: wkPee.length, lbl: 'Pee events'}
  ];
  if(wkPee.length) stats.push({type:'bar', value: avgRating, lbl: 'Avg spot size'});
  renderStatsGrid(stats);
}

function renderMonthStats(anchor){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const prefix = y + '-' + String(m+1).padStart(2,'0');
  const mStraining = straining.filter(s => s.date.startsWith(prefix));
  const mPee = pee.filter(p => p.date.startsWith(prefix));
  const totalMin = mStraining.reduce((sum,s) => sum + (s.end - s.start)/60000, 0);
  const avgRating = mPee.length ? (mPee.reduce((s,p)=>s+p.rating,0)/mPee.length) : 0;
  renderStatsGrid([
    {num: mStraining.length, lbl: 'Straining episodes'},
    {num: Math.round(totalMin) + ' min', lbl: 'Total straining'},
    {num: mPee.length, lbl: 'Pee events'},
    {num: mPee.length ? avgRating.toFixed(1) : '—', lbl: 'Avg spot size'}
  ]);
}

// Averages/max/min are computed per DAY across the whole year (not per
// month), since "average daily straining events" etc. is what's meaningful
// for spotting overall patterns.
function renderYearStats(anchor){
  const y = anchor.getFullYear();
  const yearDays = [];
  const start = new Date(y,0,1), end = new Date(y,11,31);
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const key = dateKeyFromDate(d);
    if(dayInRange(key)) yearDays.push(key);
  }
  if(!yearDays.length){
    renderStatsGrid([{num:'—', lbl:'No data this year'}]);
    return;
  }
  const perDay = computePerDay(yearDays);
  const strainCounts = perDay.map(d => straining.filter(s=>s.date===d.date).length);
  const strainMins = perDay.map(d => d.mins);
  const peeCounts = perDay.map(d => d.peeCount);

  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;

  renderStatsGrid([
    {num: avg(strainCounts).toFixed(1), lbl: 'Avg daily straining events'},
    {num: Math.max(...strainCounts), lbl: 'Max daily straining events'},
    {num: Math.min(...strainCounts), lbl: 'Min daily straining events'},
    {num: Math.round(avg(strainMins)) + ' min', lbl: 'Avg daily straining time'},
    {num: Math.round(Math.max(...strainMins)) + ' min', lbl: 'Max daily straining time'},
    {num: Math.round(Math.min(...strainMins)) + ' min', lbl: 'Min daily straining time'},
    {num: avg(peeCounts).toFixed(1), lbl: 'Avg daily pee events'},
    {num: Math.max(...peeCounts), lbl: 'Max daily pee events'},
    {num: Math.min(...peeCounts), lbl: 'Min daily pee events'}
  ]);
}

function renderYearView(anchor){
  const y = anchor.getFullYear();
  const container = document.getElementById('viewContainer');
  container.innerHTML =
    '<div class="chart-card"><h3>Total straining (min) by month</h3><div class="chart-canvas" id="chartYearMins"></div></div>' +
    '<div class="chart-card"><h3>Pee events by month</h3><div class="chart-canvas" id="chartYearPeeCount"></div></div>' +
    '<div class="chart-card"><h3>Total pee score by month</h3><div class="chart-canvas" id="chartYearPeeSum"></div></div>';

  const months = [];
  for(let m=0; m<12; m++){
    const label = new Date(y,m,1).toLocaleDateString(undefined,{month:'short'});
    const prefix = y + '-' + String(m+1).padStart(2,'0');
    const s = straining.filter(x => x.date.startsWith(prefix));
    const p = pee.filter(x => x.date.startsWith(prefix));
    months.push({
      date: label,
      mins: s.reduce((sum,x)=>sum+(x.end-x.start)/60000,0),
      peeCount: p.length,
      peeSum: p.reduce((sum,x)=>sum+x.rating,0)
    });
  }

  drawBarChart('chartYearMins', months, 'var(--strain)', d=>d.mins, v=>Math.round(v)+'m', true);
  drawBarChart('chartYearPeeCount', months, 'var(--pee)', d=>d.peeCount, v=>String(v), true);
  drawBarChart('chartYearPeeSum', months, 'var(--pee)', d=>d.peeSum, v=>String(v), true);
}

// ---- Tooltip ----

// Anchored just above the top of the scrub guide-line, at the same x
// position — so it moves left/right with your finger instead of sitting in
// one fixed spot (and specifically doesn't sit under the thumb, since it's
// pinned above the chart rather than at the touch point itself).
function showTooltip(clientX, clientY, lines){
  const tooltip = d3.select('#tooltip');
  const html = lines.join('<br>');
  const clampedX = Math.max(60, Math.min(clientX, window.innerWidth - 60));
  tooltip.style('opacity',1)
    .style('left', clampedX + 'px')
    .style('transform', 'translate(-50%, calc(-100% - 10px))')
    .style('top', clientY + 'px')
    .html(html);
}
function hideTooltip(){ d3.select('#tooltip').style('opacity',0); }
document.addEventListener('click', hideTooltip);

// Large, clear number + a plain visual bar (no text on the bar itself) for
// any 1–6 style rating, used in place of "5.0/6" style text.
function ratingBarHtml(value, max){
  const pct = Math.max(0, Math.min(100, (value/max)*100));
  return '<div style="display:flex;align-items:center;gap:8px;margin-top:2px;">'
    + '<span style="font-size:1.3em;font-weight:800;line-height:1;">' + value + '</span>'
    + '<span style="flex:1;min-width:70px;height:7px;background:rgba(255,255,255,0.25);border-radius:4px;overflow:hidden;">'
    + '<span style="display:block;height:100%;width:' + pct + '%;background:#fff;border-radius:4px;"></span>'
    + '</span></div>';
}

function fmtTime(d){
  return d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', hour12:false});
}

function getScrollParent(el){
  let node = el;
  while(node && node !== document.body && node !== document.documentElement){
    const style = window.getComputedStyle(node);
    if(/(auto|scroll)/.test(style.overflowY) && node.scrollHeight > node.clientHeight) return node;
    node = node.parentElement;
  }
  return document.scrollingElement || document.documentElement;
}

// Attaches scrub-only drag behavior to a chart overlay. Charts never
// complete a swipe/period-change themselves — that's handled by a separate
// zone (see setupSwipeZone) so a drag that starts on a chart always just
// reads data, no matter how far or which direction it moves.
// touch-action:none gives us full manual control of the scroll-vs-scrub
// decision (the browser's own pan-y heuristic handed off to scrolling far
// too eagerly during an intended scrub). Once a drag clearly commits to
// being vertical — past a deliberately high, tunable bar — we take over
// scrolling manually ourselves; short of that bar, everything scrubs.
// setPointerCapture keeps pointermove/pointerup targeting this exact overlay
// even if the finger drifts over other elements. onEnd always hides the
// tooltip and clears any highlight — nothing lingers after you let go.
const SCROLL_TAKEOVER_DY = 32;   // px of vertical travel before scroll can win
const SCROLL_TAKEOVER_RATIO = 2.2; // how much more vertical than horizontal it must be

function attachDragGestures(overlaySelection, onMove, onEnd){
  let mode = null; // null | 'scroll' (locks in once triggered; otherwise every move defaults to scrub)
  let startX = 0, startY = 0, scrollAnchorY = 0, scrollAnchorTop = 0, scrollEl = null;

  overlaySelection.style('cursor', 'crosshair');
  overlaySelection.style('touch-action', 'none');
  overlaySelection.on('pointerdown', function(event){
    event.stopPropagation();
    mode = null;
    startX = event.clientX; startY = event.clientY;
    scrollEl = getScrollParent(this);
    this.setPointerCapture(event.pointerId);
    const offsetX = event.offsetX ?? d3.pointer(event, this)[0];
    onMove(offsetX, event);
  });
  overlaySelection.on('pointermove', function(event){
    const dx = event.clientX - startX, dy = event.clientY - startY;
    if(mode !== 'scroll' &&
       Math.abs(dy) > SCROLL_TAKEOVER_DY && Math.abs(dy) > Math.abs(dx) * SCROLL_TAKEOVER_RATIO){
      mode = 'scroll';
      // Anchor both the pointer position and the scroll position at the exact
      // moment of takeover, so scrollTop is always computed as an absolute
      // function of total displacement since then — not accumulated frame by
      // frame, which was prone to drifting/oscillating.
      scrollAnchorY = event.clientY;
      scrollAnchorTop = scrollEl ? scrollEl.scrollTop : 0;
      hideTooltip();
      if(onEnd) onEnd();
    }
    if(mode === 'scroll'){
      event.stopPropagation();
      if(scrollEl) scrollEl.scrollTop = scrollAnchorTop - (event.clientY - scrollAnchorY);
      return;
    }
    // Default: scrub. No separate low-bar "commit" check — that was locking
    // out the scroll test almost instantly on any real touch's natural wobble.
    event.stopPropagation();
    const offsetX = event.offsetX ?? d3.pointer(event, this)[0];
    onMove(offsetX, event);
  });
  overlaySelection.on('pointerup pointerleave pointercancel', function(event){
    event.stopPropagation();
    hideTooltip();
    if(onEnd) onEnd();
    mode = null;
  });
  overlaySelection.on('click', function(event){ event.stopPropagation(); });
}

// Weather overlaid directly on the same plot as straining/pee (drawn first,
// underneath, so it reads as background context rather than competing for
// space). Fill uses a fixed vertical gradient — dark near the top of the
// plot, fading to transparent near the bottom — so a higher line naturally
// shows more of the dark end. Height+color alone convey intensity.
function drawWeatherArea(g, x, plotWidth, plotHeight, dayStart, weather, date){
  const hasWeather = weather && weather.hours && Object.keys(weather.hours).length > 0;
  if(!hasWeather) return () => null;

  const pts = [];
  for(let hr=0; hr<=24; hr++){
    const src = weather.hours[hr === 24 ? 23 : hr];
    pts.push({t: new Date(dayStart.getTime() + hr*3600000), sev: src ? src.severity : 0});
  }
  const anyWeather = pts.some(p => p.sev > 0);
  if(!anyWeather){
    g.append('text')
      .attr('x', plotWidth/2).attr('y', plotHeight - 14)
      .attr('text-anchor','middle').attr('fill','var(--ink-soft)').attr('font-size','12px')
      .text('No weather events today');
  }
  const ys = d3.scaleLinear().domain([0,4]).range([plotHeight, 0]);

  const gradId = 'wxgrad_' + date.replace(/-/g,'');
  const defs = g.append('defs');
  defs.append('linearGradient')
    .attr('id', gradId)
    .attr('gradientUnits', 'userSpaceOnUse')
    .attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', plotHeight)
    .selectAll('stop')
    .data([{o:'0%', c:'rgba(28,79,115,0.55)'}, {o:'100%', c:'rgba(58,111,156,0)'}])
    .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

  const areaGen = d3.area().curve(d3.curveMonotoneX)
    .x(d => x(d.t)).y0(plotHeight).y1(d => ys(d.sev));
  const lineGen = d3.line().curve(d3.curveMonotoneX)
    .x(d => x(d.t)).y(d => ys(d.sev));

  g.append('path').datum(pts).attr('d', areaGen).attr('fill', 'url(#' + gradId + ')');
  g.append('path').datum(pts).attr('d', lineGen).attr('fill', 'none')
    .attr('stroke', 'rgba(28,79,115,0.8)').attr('stroke-width', 1.5);

  return function(t){
    const w = weather.hours[t.getHours()];
    if(!w || w.severity === 0) return null;
    return ['Weather: gusts ' + Math.round(w.gust) + ' km/h, ' + w.precip.toFixed(1) + 'mm rain'];
  };
}

// Feeding times: full-height reference lines overlaid on the same plot —
// fixed schedule, not a magnitude, so just presence.
function drawFeedingLines(g, x, plotWidth, plotHeight, dayStart){
  const marks = FEEDING_TIMES.map(f => {
    const t = new Date(dayStart);
    t.setHours(f.hour, f.minute, 0, 0);
    return {time: t, label: f.label};
  });

  g.selectAll('.feedline').data(marks).enter().append('line')
    .attr('x1', d => x(d.time)).attr('x2', d => x(d.time))
    .attr('y1', -18).attr('y2', plotHeight)
    .attr('stroke', '#c99a3a').attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '4,3').style('opacity', 0.7);

  // Plain flag shape, no on-chart text — tap/scrub reveals which meal it is.
  const flagW = 11, flagH = 9;
  const flagX = d => Math.max(0, Math.min(plotWidth, x(d.time)));
  g.selectAll('.feedflag').data(marks).enter().append('path')
    .attr('transform', d => `translate(${flagX(d)},-18)`)
    .attr('d', `M0,0 L${flagW},${flagH/2} L0,${flagH} Z`)
    .attr('fill', '#c99a3a');

  return function(t, offsetX){
    let nearest = null, dist = Infinity;
    marks.forEach(m => {
      const d = Math.abs(x(m.time) - offsetX);
      if(d < dist){ dist = d; nearest = m; }
    });
    if(nearest && dist < 14) return [nearest.label + ' · ' + fmtTime(nearest.time)];
    return null;
  };
}

// User-logged stressful/loud events: full-height lines overlaid on the same
// plot, one per event that day, labeled with whatever was typed when saving.
function drawStressEventLines(g, x, plotWidth, plotHeight, dayStart, weather, date){
  const dayEvents = stressEvents.filter(ev => ev.date === date);
  g.selectAll('.eventline').data(dayEvents).enter().append('line')
    .attr('x1', d => x(d.time)).attr('x2', d => x(d.time))
    .attr('y1', 0).attr('y2', plotHeight)
    .attr('stroke', '#7a3b8c').attr('stroke-width', 2)
    .style('opacity', 0.7);

  if(!dayEvents.length){
    g.append('text')
      .attr('x', plotWidth/2).attr('y', plotHeight - 14)
      .attr('text-anchor','middle').attr('fill','var(--ink-soft)').attr('font-size','12px')
      .text('No stressful events today');
    return () => null;
  }
  return function(t, offsetX){
    let nearest = null, dist = Infinity;
    dayEvents.forEach(ev => {
      const d = Math.abs(x(ev.time) - offsetX);
      if(d < dist){ dist = d; nearest = ev; }
    });
    if(nearest && dist < 14){
      let line = escapeHtml(nearest.label) + ' · ' + fmtTime(nearest.time);
      if(nearest.rating) line += ratingBarHtml(nearest.rating, 6);
      return [line];
    }
    return null;
  };
}

// Shared Day-view chart: draws the straining/pee core (bands, night gradient,
// episodes, pee bars, axes) plus one swappable "extra signal" overlay drawn
// directly onto the same plot — every chart type works as a true overlay now,
// none reserve separate strip space. Scrub + swipe use an overlay covering
// the FULL canvas so dragging works anywhere on the chart, not just a narrow
// hit-zone.
function drawCoreDayChart(containerId, date, drawExtra){
  const area = document.getElementById(containerId);
  const dayStraining = straining.filter(s => s.date === date);
  const dayPee = pee.filter(p => p.date === date);
  const weather = weatherByDate[date];

  const dayStart = new Date(date + 'T00:00:00');
  const dayEnd = new Date(dayStart.getTime() + 24*3600000);

  const margin = {top: 32, right: 40, bottom: 32, left: 10};
  const width = Math.max(area.clientWidth || 320, 260);
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = 260;

  const svg = d3.select(area).append('svg')
    .attr('width', width).attr('height', plotHeight + margin.top + margin.bottom);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleTime().domain([dayStart, dayEnd]).range([0, plotWidth]);
  const y = d3.scaleLinear().domain([0,6]).range([plotHeight, 0]);

  let bandT = new Date(dayStart), bandIdx = 0;
  const bands = [];
  while(bandT < dayEnd){
    const next = new Date(Math.min(bandT.getTime() + 15*60000, dayEnd.getTime()));
    bands.push({start: new Date(bandT), end: next, idx: bandIdx});
    bandT = next; bandIdx++;
  }
  g.selectAll('.band').data(bands).enter().append('rect')
    .attr('class','band')
    .attr('x', d => x(d.start))
    .attr('width', d => Math.max(0, x(d.end) - x(d.start)))
    .attr('y', 0).attr('height', plotHeight)
    .attr('fill', d => d.idx % 2 === 0 ? 'var(--band-a)' : 'var(--band-b)');

  // Night shading: mostly a solid, clearly-readable night tint, with only a
  // short twilight transition around sunrise/sunset — not a fade across the
  // whole night. A subtle vignette makes the outer edges (deep night, near
  // midnight) a touch darker/bluer than the middle of the night span, for a
  // bit of visual depth without raising the overall opacity.
  if(weather && weather.sunrise && weather.sunset){
    const NIGHT_OPACITY = 0.09;
    const NIGHT_EDGE_OPACITY = 0.25;
    const TWILIGHT_MIN = 100; // minutes of fade on either side of sunrise/sunset
    const nightColor = c => `rgba(16,22,46,${c})`;
    const twilightStart = new Date(weather.sunrise.getTime() - TWILIGHT_MIN*60000);
    const twilightEnd = new Date(weather.sunset.getTime() + TWILIGHT_MIN*60000);

    const defsNight = g.append('defs');
    const gradMorningId = 'nightAM_' + containerId + '_' + date.replace(/-/g,'');
    const gradEveningId = 'nightPM_' + containerId + '_' + date.replace(/-/g,'');
    const gradEdgeAMId = 'nightEdgeAM_' + containerId + '_' + date.replace(/-/g,'');
    const gradEdgePMId = 'nightEdgePM_' + containerId + '_' + date.replace(/-/g,'');

    defsNight.append('linearGradient')
      .attr('id', gradMorningId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(twilightStart)).attr('y1',0).attr('x2', x(weather.sunrise)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(NIGHT_OPACITY)},{o:'100%', c:nightColor(0)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    defsNight.append('linearGradient')
      .attr('id', gradEveningId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(weather.sunset)).attr('y1',0).attr('x2', x(twilightEnd)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(0)},{o:'100%', c:nightColor(NIGHT_OPACITY)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    // Deep-night vignette: slightly darker right at the day boundary (the
    // middle of the actual night), easing back to the base night tone.
    defsNight.append('linearGradient')
      .attr('id', gradEdgeAMId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(dayStart)).attr('y1',0).attr('x2', x(twilightStart)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(NIGHT_EDGE_OPACITY)},{o:'100%', c:nightColor(NIGHT_OPACITY)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    defsNight.append('linearGradient')
      .attr('id', gradEdgePMId).attr('gradientUnits','userSpaceOnUse')
      .attr('x1', x(twilightEnd)).attr('y1',0).attr('x2', x(dayEnd)).attr('y2',0)
      .selectAll('stop')
      .data([{o:'0%', c:nightColor(NIGHT_OPACITY)},{o:'100%', c:nightColor(NIGHT_EDGE_OPACITY)}])
      .enter().append('stop').attr('offset', d=>d.o).attr('stop-color', d=>d.c);

    // Solid night (before the morning twilight window starts) — vignette gradient
    g.append('rect')
      .attr('x', x(dayStart)).attr('width', Math.max(0, x(twilightStart) - x(dayStart)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradEdgeAMId + ')');
    // Morning twilight fade (night -> day)
    g.append('rect')
      .attr('x', x(twilightStart)).attr('width', Math.max(0, x(weather.sunrise) - x(twilightStart)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradMorningId + ')');
    // Evening twilight fade (day -> night)
    g.append('rect')
      .attr('x', x(weather.sunset)).attr('width', Math.max(0, x(twilightEnd) - x(weather.sunset)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradEveningId + ')');
    // Solid night (after the evening twilight window ends) — vignette gradient
    g.append('rect')
      .attr('x', x(twilightEnd)).attr('width', Math.max(0, x(dayEnd) - x(twilightEnd)))
      .attr('y', 0).attr('height', plotHeight).attr('fill', 'url(#' + gradEdgePMId + ')');

    [weather.sunrise, weather.sunset].forEach(t => {
      g.append('line')
        .attr('x1', x(t)).attr('x2', x(t)).attr('y1', 0).attr('y2', plotHeight)
        .attr('stroke', 'var(--ink-soft)').attr('stroke-width', 1)
        .attr('stroke-dasharray', '2,3').style('opacity', 0.4);
    });
  }

  const extraTooltipFn = drawExtra(g, x, plotWidth, plotHeight, dayStart, weather, date);

  g.selectAll('.gridline').data([1,2,3,4,5,6]).enter().append('line')
    .attr('class','gridline')
    .attr('x1', 0).attr('x2', plotWidth)
    .attr('y1', d => y(d)).attr('y2', d => y(d));

  g.selectAll('.strain').data(dayStraining).enter().append('rect')
    .attr('class','strain')
    .attr('x', d => x(d.start))
    .attr('width', d => Math.max(5, x(d.end) - x(d.start)))
    .attr('y', 0).attr('height', plotHeight)
    .attr('fill', 'var(--strain-soft)')
    .attr('stroke', 'var(--strain)').attr('stroke-width', 1);

  const barW = Math.max(8, Math.min(18, plotWidth/40));
  g.selectAll('.pee').data(dayPee).enter().append('rect')
    .attr('class','pee')
    .attr('x', d => x(d.time) - barW/2)
    .attr('width', barW)
    .attr('y', d => y(d.rating))
    .attr('height', d => plotHeight - y(d.rating))
    .attr('rx', 3)
    .attr('fill', 'var(--pee)')
    .attr('stroke', '#1a3f3d').attr('stroke-width', 0.5);

  if(!dayStraining.length && !dayPee.length){
    g.append('text')
      .attr('x', plotWidth/2).attr('y', plotHeight/2)
      .attr('text-anchor', 'middle').attr('fill', 'var(--ink-soft)').attr('font-size', '13px')
      .text('No straining or pee logged this day');
  }

  const xTickCount = Math.max(3, Math.floor(plotWidth / 58));
  g.append('g').attr('class','axis')
    .attr('transform', `translate(0,${plotHeight})`)
    .call(d3.axisBottom(x).ticks(xTickCount).tickFormat(d3.timeFormat('%H:%M')));
  g.append('g').attr('class','axis')
    .attr('transform', `translate(${plotWidth},0)`)
    .call(d3.axisRight(y).ticks(6).tickFormat(d3.format('d')));

  const guideLine = g.append('line')
    .attr('y1', 0).attr('y2', plotHeight)
    .attr('stroke', 'var(--ink)').attr('stroke-width', 1)
    .attr('stroke-dasharray', '3,3').style('opacity', 0).style('pointer-events', 'none');

  function hoursSinceSunrise(t){
    if(!weather || !weather.sunrise) return null;
    return (t - weather.sunrise) / 3600000;
  }

  function updateScrub(offsetX){
    offsetX = Math.max(0, Math.min(plotWidth, offsetX));
    const t = x.invert(offsetX);
    const containing = dayStraining.find(s => t >= s.start && t <= s.end);

    let nearestPee = null, nearestDist = Infinity;
    dayPee.forEach(p => {
      const d = Math.abs(x(p.time) - offsetX);
      if(d < nearestDist){ nearestDist = d; nearestPee = p; }
    });
    const showPee = nearestPee && nearestDist < 24;

    guideLine.attr('x1', offsetX).attr('x2', offsetX).style('opacity', 1);

    let lines = [fmtTime(t)];
    if(containing){
      const mins = Math.round((containing.end - containing.start)/60000);
      let strainLine = 'Straining ' + fmtTime(containing.start) + '–' + fmtTime(containing.end) + ' (' + mins + ' min)';
      if(containing.note) strainLine += '<br><span style="opacity:0.85;">' + escapeHtml(containing.note) + '</span>';
      lines.push(strainLine);
    }
    if(showPee){
      let peeLine = 'Pee at ' + fmtTime(nearestPee.time) + ratingBarHtml(nearestPee.rating, 6);
      if(nearestPee.note) peeLine += '<span style="opacity:0.85;">' + escapeHtml(nearestPee.note) + '</span>';
      lines.push(peeLine);
    }
    const extraLines = extraTooltipFn ? extraTooltipFn(t, offsetX) : null;
    if(extraLines) lines.push(...extraLines);
    const hrs = hoursSinceSunrise(t);
    if(hrs !== null){
      lines.push(hrs >= 0 ? hrs.toFixed(1) + 'h after sunrise' : Math.abs(hrs).toFixed(1) + 'h before sunrise');
    }
    return lines;
  }

  // Overlay covers the ENTIRE svg canvas (not just the inner plot rect), so a
  // drag started over the axis or margins still scrubs/swipes instead of
  // landing in a dead zone.
  const overlay = svg.append('rect')
    .attr('x', 0).attr('y', 0)
    .attr('width', width).attr('height', plotHeight + margin.top + margin.bottom)
    .attr('fill', 'transparent');

  attachDragGestures(overlay,
    (rawOffsetX, event) => {
      const rect = svg.node().getBoundingClientRect();
      const clampedX = Math.max(0, Math.min(plotWidth, rawOffsetX - margin.left));
      showTooltip(rect.left + margin.left + clampedX, rect.top + margin.top, updateScrub(rawOffsetX - margin.left));
    },
    () => guideLine.style('opacity', 0)
  );
}

// ---- Week & Month views: 3 charts each (straining time, pee count, pee total),
// styled and gestured the same way as Day view. ----

function renderMultiDayCharts(days){
  const container = document.getElementById('viewContainer');
  container.innerHTML =
    '<div class="chart-card"><h3>Total straining (min)</h3><div class="chart-canvas" id="chartMins"></div></div>' +
    '<div class="chart-card"><h3>Number of pee events</h3><div class="chart-canvas" id="chartPeeCount"></div></div>' +
    '<div class="chart-card"><h3>Total pee score (sum of sizes)</h3><div class="chart-canvas" id="chartPeeSum"></div></div>';

  const stats = computePerDay(days);
  drawBarChart('chartMins', stats, 'var(--strain)', d => d.mins, v => Math.round(v) + 'm');
  drawBarChart('chartPeeCount', stats, 'var(--pee)', d => d.peeCount, v => String(v));
  drawBarChart('chartPeeSum', stats, 'var(--pee)', d => d.peeSum, v => String(v));
}

function drawBarChart(containerId, stats, color, valueFn, formatFn, labelsOnly){
  const area = document.getElementById(containerId);
  const margin = {top: 18, right: 20, bottom: 24, left: 30};
  const width = Math.max(area.clientWidth || 320, 260);
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = 190;
  const n = stats.length;

  const values = stats.map(valueFn);
  const maxVal = Math.max(1, ...values);

  const svg = d3.select(area).append('svg')
    .attr('width', width).attr('height', plotHeight + margin.top + margin.bottom);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(stats.map(s => s.date)).range([0, plotWidth]).padding(n > 15 ? 0.15 : 0.35);
  const y = d3.scaleLinear().domain([0, maxVal]).range([plotHeight, 0]);

  const todayKey = todayKeyStr();
  const isWeek = n <= 7;
  const isMonthGranularity = !labelsOnly && n > 7;
  const tickEvery = n > 15 ? Math.ceil(n / 10) : 1;
  const tickVals = stats.map(s=>s.date).filter((_,i) => i % tickEvery === 0);

  // Alternate background shading per calendar week (Sun–Sat) so week
  // boundaries are visible across a month of daily bars.
  if(isMonthGranularity){
    let weekIdx = 0, prevDow = null;
    stats.forEach(s => {
      const [yy,mm,dd] = s.date.split('-').map(Number);
      const dow = new Date(yy,mm-1,dd).getDay();
      if(prevDow !== null && dow === 0) weekIdx++;
      prevDow = dow;
      g.append('rect')
        .attr('x', x(s.date)).attr('width', x.step())
        .attr('y', 0).attr('height', plotHeight)
        .attr('fill', weekIdx % 2 === 0 ? 'var(--week-band-a)' : 'var(--week-band-b)');
    });
  }

  g.append('g').attr('class','axis')
    .attr('transform', `translate(0,${plotHeight})`)
    .call(d3.axisBottom(x).tickValues(tickVals).tickFormat(d => {
      if(labelsOnly) return d;
      const [yy,mm,dd] = d.split('-').map(Number);
      const dt = new Date(yy,mm-1,dd);
      return isWeek ? dt.toLocaleDateString(undefined,{weekday:'short'}) : String(dd);
    }));
  g.append('g').attr('class','axis').call(d3.axisLeft(y).ticks(4));

  g.selectAll('.daybar').data(stats).enter().append('rect')
    .attr('class','daybar')
    .attr('x', d => x(d.date))
    .attr('width', x.bandwidth())
    .attr('y', d => y(valueFn(d)))
    .attr('height', d => plotHeight - y(valueFn(d)))
    .attr('rx', 3)
    .attr('fill', d => (labelsOnly || dayInRange(d.date)) ? color : 'var(--line)')
    .attr('opacity', d => d.date === todayKey ? 1 : 0.85)
    .style('cursor', d => (!labelsOnly && dayInRange(d.date)) ? 'pointer' : 'default')
    .on('click', function(event, d){
      event.stopPropagation();
      if(!labelsOnly && dayInRange(d.date)) jumpToDay(d.date);
    });

  const guideRect = g.append('rect')
    .attr('y', 0).attr('height', plotHeight)
    .attr('fill', 'none').attr('stroke', 'var(--ink)').attr('stroke-width', 1.5)
    .style('opacity', 0).style('pointer-events', 'none');

  function updateScrub(offsetX){
    const idx = Math.max(0, Math.min(n-1, Math.floor(offsetX / (plotWidth / n))));
    const d = stats[idx];
    guideRect.attr('x', x(d.date)).attr('width', x.bandwidth()).style('opacity', 1);
    let label;
    if(labelsOnly){
      label = d.date;
    } else {
      const [yy,mm,dd] = d.date.split('-').map(Number);
      label = new Date(yy,mm-1,dd).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
    }
    return [label, formatFn(valueFn(d))];
  }

  const overlay = svg.append('rect')
    .attr('x', 0).attr('y', 0).attr('width', width).attr('height', plotHeight + margin.top + margin.bottom)
    .attr('fill', 'transparent');

  attachDragGestures(overlay,
    (rawOffsetX, event) => {
      const rect = svg.node().getBoundingClientRect();
      const clampedX = Math.max(0, Math.min(plotWidth, rawOffsetX - margin.left));
      showTooltip(rect.left + margin.left + clampedX, rect.top + margin.top, updateScrub(rawOffsetX - margin.left));
    },
    () => guideRect.style('opacity', 0)
  );
}

// Swipe between periods: dragging over the header/stats zone (never the
// chart itself — charts are scrub-only, see attachDragGestures above, so a
// swipe that starts on a chart can never complete a period change).
// Uses angle-based detection (how much MORE horizontal than vertical the
// motion is) rather than a fixed vertical cutoff, since a natural swipe's
// vertical wobble scales with how far you've dragged — a fixed pixel cutoff
// made longer swipes fail inconsistently. touch-action:none stops the page
// from trying to scroll during the gesture.
// Pull-to-refresh: installed home-screen web apps have no browser chrome, so
// there's no native pull-to-refresh at all — this replaces it. The bar above
// the content grows as you pull (pushing content down, same as a native
// app), with the icon dimmed/small until "charged" past the threshold, at
// which point it goes full opacity/size. Release while charged to refresh
// (it spins while loadData() runs); release early and it un-winds/cancels.
// Vibration is a no-op on iOS (no Vibration API there) but works on Android.
(function setupPullToRefresh(){
  const bar = document.getElementById('pullRefreshBar');
  const icon = document.getElementById('pullRefreshIcon');
  const MAX_PULL = 64;
  const THRESHOLD = 44;
  let scrollEl = null, startY = null, pulling = false, refreshing = false, armed = false;

  function getContainer(){
    const frame = document.getElementById('deviceFrame');
    if(frame && /(auto|scroll)/.test(getComputedStyle(frame).overflowY)) return frame;
    return document.scrollingElement || document.documentElement;
  }

  function onDown(e){
    if(refreshing) return;
    scrollEl = getContainer();
    if(scrollEl.scrollTop > 0){ startY = null; return; }
    startY = e.clientY;
    pulling = true;
    armed = false;
    bar.style.transition = 'none';
  }
  function onMove(e){
    if(!pulling || startY === null) return;
    const dy = e.clientY - startY;
    if(dy <= 0){
      bar.style.height = '0px';
      icon.classList.remove('armed');
      armed = false;
      return;
    }
    const pull = Math.min(MAX_PULL, dy * 0.4); // damped ~40% follow, with resistance
    bar.style.height = pull + 'px';
    armed = pull >= THRESHOLD;
    icon.classList.toggle('armed', armed);
    icon.style.transform = `scale(${0.6 + 0.4*(pull/MAX_PULL)}) rotate(${pull*4}deg)`;
  }
  function onUp(){
    if(!pulling) return;
    pulling = false;
    bar.style.transition = 'height .28s cubic-bezier(0.22,0.61,0.36,1)';
    if(armed){
      refreshing = true;
      bar.classList.add('spinning');
      bar.style.height = '50px';
      icon.classList.add('armed');
      icon.style.transform = '';
      if(navigator.vibrate) navigator.vibrate(15);
      loadData();
      setTimeout(() => {
        bar.classList.remove('spinning');
        bar.style.transition = 'height .28s cubic-bezier(0.22,0.61,0.36,1)';
        bar.style.height = '0px';
        icon.classList.remove('armed');
        refreshing = false;
      }, 900);
    } else {
      bar.style.height = '0px';
      icon.classList.remove('armed');
    }
  }

  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
})();

(function setupSwipeZone(){
  const zone = document.querySelector('.wrap');
  // No touch-action override here — this ancestor conflicting with the chart
  // overlay's touch-action:none (a descendant) was likely the cause of the
  // erratic scroll jumping; this zone's own logic doesn't need one.
  let startX = null, startY = null, tracking = false;

  function onDown(e){
    if(e.target.closest('.chart-canvas')) return;
    startX = e.clientX; startY = e.clientY; tracking = true;
  }
  function onUp(e){
    if(!tracking || startX === null){ tracking = false; return; }
    tracking = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) < 55) return;
    if(Math.abs(dx) < Math.abs(dy) * 1.6) return; // too vertical — not a swipe
    if(dx < 0) shiftPeriod(1); else shiftPeriod(-1);
  }
  zone.addEventListener('pointerdown', onDown);
  zone.addEventListener('pointerup', onUp);
  zone.addEventListener('pointercancel', () => tracking = false);
})();

window.addEventListener('resize', renderCurrentView);
initDeviceMode();
updateIconsAndManifest(generateDefaultIcon());
loadData();
</script>
</body>
